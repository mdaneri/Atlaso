name: Publish appliance release

on:
  workflow_run:
    workflows:
      - Publish Python wheel
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_sha:
        description: Successful main CI commit to publish or recover
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: appliance-release-${{ inputs.release_sha || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release target
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.target.outputs.release_sha }}
    steps:
      - name: Check out protected main admission tooling
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate successful main CI release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PUBLISHER_RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLISHER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          if test "${{ github.event_name }}" = workflow_run; then
            PUBLISHER_ARTIFACTS="$(gh api \
              "repos/${{ github.repository }}/actions/runs/${PUBLISHER_RUN_ID}/artifacts")"
            CANDIDATE_ARTIFACTS="$(jq -r \
              '.artifacts[] |
               select(.expired == false and
                 (.name | test("^atlaso-wheel-v[0-9]+\\.[0-9]+\\.[0-9]+-[0-9a-f]{40}$"))) |
               [.id, .name] | @tsv' \
              <<<"$PUBLISHER_ARTIFACTS")"
            test -n "$CANDIDATE_ARTIFACTS"
            SELECTED_ARTIFACTS=0
            while IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_NAME; do
              CANDIDATE_ZIP="$RUNNER_TEMP/automatic-wheel-${ARTIFACT_ID}.zip"
              CANDIDATE_IDENTITY="$RUNNER_TEMP/automatic-wheel-identity-${ARTIFACT_ID}.json"
              gh api "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
                > "$CANDIDATE_ZIP"
              CANDIDATE_MEMBERS="$(unzip -Z1 "$CANDIDATE_ZIP" | sort)"
              CANDIDATE_WHEEL="$(grep -E '^atlaso-[0-9]+\.[0-9]+\.[0-9]+-py3-none-any\.whl$' \
                <<<"$CANDIDATE_MEMBERS" || true)"
              if test -z "$CANDIDATE_WHEEL" || test "$CANDIDATE_MEMBERS" != \
                "$(printf '%s\n' "$CANDIDATE_WHEEL" wheel-identity.json | sort)"; then
                continue
              fi
              unzip -p "$CANDIDATE_ZIP" wheel-identity.json > "$CANDIDATE_IDENTITY"
              CANDIDATE_CANONICAL="$(jq -cS . "$CANDIDATE_IDENTITY")"
              if test "$CANDIDATE_CANONICAL" != "$(cat "$CANDIDATE_IDENTITY")"; then
                continue
              fi
              if test "$(jq -r .publisher.run_id <<<"$CANDIDATE_CANONICAL")" = "$PUBLISHER_RUN_ID" && \
                test "$(jq -r .publisher.run_attempt <<<"$CANDIDATE_CANONICAL")" = "$PUBLISHER_RUN_ATTEMPT"; then
                SELECTED_ARTIFACTS=$((SELECTED_ARTIFACTS + 1))
                cp "$CANDIDATE_ZIP" "$RUNNER_TEMP/automatic-wheel.zip"
                cp "$CANDIDATE_IDENTITY" "$RUNNER_TEMP/automatic-wheel-identity.json"
                SELECTED_ARTIFACT_NAME="$ARTIFACT_NAME"
                SELECTED_WHEEL="$CANDIDATE_WHEEL"
              fi
            done <<<"$CANDIDATE_ARTIFACTS"
            test "$SELECTED_ARTIFACTS" -eq 1
            IDENTITY="$(jq -cS . "$RUNNER_TEMP/automatic-wheel-identity.json")"
            test "$IDENTITY" = "$(cat "$RUNNER_TEMP/automatic-wheel-identity.json")"
            RELEASE_SHA="$(jq -r .commit <<<"$IDENTITY")"
            VERSION="$(jq -r .version <<<"$IDENTITY")"
            test "$(jq -r .repository <<<"$IDENTITY")" = "${{ github.repository }}"
            test "$(jq -r .publisher.workflow <<<"$IDENTITY")" = "Publish Python wheel"
            test "$(jq -r .publisher.workflow_file <<<"$IDENTITY")" = wheel.yml
            test "$(jq -r .publisher.run_id <<<"$IDENTITY")" = "$PUBLISHER_RUN_ID"
            test "$(jq -r .publisher.run_attempt <<<"$IDENTITY")" = "$PUBLISHER_RUN_ATTEMPT"
            test "$(jq -r .publisher.trigger <<<"$IDENTITY")" = automatic-main
            test "$SELECTED_ARTIFACT_NAME" = "atlaso-wheel-v${VERSION}-${RELEASE_SHA}"
            test "$SELECTED_WHEEL" = "atlaso-${VERSION}-py3-none-any.whl"
          fi
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Release SHA must be a full lowercase hexadecimal commit."
            exit 1
          fi
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          printf '{"release_sha":"%s"}\n' "$RELEASE_SHA" > validated-release-request.json
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload the validated release request
        uses: actions/upload-artifact@v7
        with:
          name: validated-release-request
          path: validated-release-request.json
          if-no-files-found: error
          retention-days: 1

  wheelhouse:
    name: Build ${{ matrix.abi }} wheelhouse
    needs:
      - prepare
      - release_inputs
    if: needs.release_inputs.outputs.existing_release != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - python: '3.14'
            abi: cp314
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install exact locked wheel build tools
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install --require-hashes --upgrade --requirement requirements-release-tools.lock
          python -m pip install --require-hashes --upgrade --requirement requirements-appliance-bootstrap.lock
      - name: Build the exact locked wheelhouse
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_SHA")"
          python -m pip wheel \
            --require-hashes \
            --no-build-isolation \
            --wheel-dir wheelhouse/${{ matrix.abi }} \
            --requirement requirements-appliance.lock
          python scripts/write_wheelhouse_lock.py --wheelhouse wheelhouse/${{ matrix.abi }}
      - name: Upload wheelhouse
        uses: actions/upload-artifact@v7
        with:
          name: wheelhouse-${{ matrix.abi }}
          path: wheelhouse/${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 7

  release_inputs:
    name: Resolve immutable release inputs
    needs:
      - prepare
    runs-on: ubuntu-latest
    outputs:
      existing_release: ${{ steps.existing_release.outputs.present }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the validated release request
        uses: actions/download-artifact@v8
        with:
          name: validated-release-request
          path: validated-release-request
      - name: Read the validated release target
        id: target
        run: |
          REQUEST=validated-release-request/validated-release-request.json
          test "$(jq -cS . "$REQUEST")" = "$(cat "$REQUEST")"
          test "$(jq -r 'keys | join(",")' "$REQUEST")" = release_sha
          RELEASE_SHA="$(jq -r .release_sha "$REQUEST")"
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Validated release request has an invalid commit."
            exit 1
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Check out protected main release tooling
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the validated commit is still on main
        env:
          RELEASE_SHA: ${{ steps.target.outputs.release_sha }}
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install locked release tooling
        env:
          PIP_CONFIG_FILE: /dev/null
        run: python -m pip install --require-hashes --requirement requirements-release-tools.lock
      - name: Resolve the immutable automatic wheel handoff
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.target.outputs.release_sha }}
        run: |
          VERSION="$(
            git show "${RELEASE_SHA}:pyproject.toml" |
              sed -nE '/^\[project\]$/,/^\[/ s/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' |
              head -n 1
          )"
          test -n "$VERSION"
          ARTIFACT_NAME="atlaso-wheel-v${VERSION}-${RELEASE_SHA}"
          CANDIDATES="$RUNNER_TEMP/wheel-candidates"
          mkdir -p "$CANDIDATES"
          gh api --paginate --slurp \
            "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            --jq '[.[].artifacts[] | select(.expired == false and .name == "'"$ARTIFACT_NAME"'")]' \
            > "$RUNNER_TEMP/wheel-artifacts.json"
          if test "$(jq length "$RUNNER_TEMP/wheel-artifacts.json")" -lt 1; then
            echo "::error::No retained automatic wheel artifact exists for $RELEASE_SHA at v$VERSION."
            exit 1
          fi
          while IFS=$'\t' read -r ARTIFACT_ID PUBLISHER_RUN_ID; do
            TARGET="$CANDIDATES/$PUBLISHER_RUN_ID-$ARTIFACT_ID"
            if test -e "$TARGET"; then
              echo "::error::Automatic wheel artifact $ARTIFACT_ID was returned more than once."
              exit 1
            fi
            mkdir "$TARGET"
            gh api "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > "$RUNNER_TEMP/wheel-${ARTIFACT_ID}.zip"
            python scripts/wheel_artifact.py extract \
              --archive "$RUNNER_TEMP/wheel-${ARTIFACT_ID}.zip" \
              --output "$TARGET"
            CANDIDATE_SOURCE_CI_RUN_ID="$(jq -r .source_ci.run_id "$TARGET/wheel-identity.json")"
            CANDIDATE_SOURCE_CI_RUN_ATTEMPT="$(jq -r .source_ci.run_attempt "$TARGET/wheel-identity.json")"
            CANDIDATE_RUN_ID="$(jq -r .publisher.run_id "$TARGET/wheel-identity.json")"
            CANDIDATE_RUN_ATTEMPT="$(jq -r .publisher.run_attempt "$TARGET/wheel-identity.json")"
            test "$CANDIDATE_RUN_ID" = "$PUBLISHER_RUN_ID"
            CANDIDATE_SOURCE_CI_STATE="$(
              gh api \
                "repos/${{ github.repository }}/actions/runs/${CANDIDATE_SOURCE_CI_RUN_ID}/attempts/${CANDIDATE_SOURCE_CI_RUN_ATTEMPT}"
            )"
            CANDIDATE_STATE="$(gh api "repos/${{ github.repository }}/actions/runs/${CANDIDATE_RUN_ID}/attempts/${CANDIDATE_RUN_ATTEMPT}")"
            test "$(jq -r .name <<<"$CANDIDATE_SOURCE_CI_STATE")" = CI
            test "$(jq -r .path <<<"$CANDIDATE_SOURCE_CI_STATE")" = .github/workflows/ci.yml
            test "$(jq -r .run_attempt <<<"$CANDIDATE_SOURCE_CI_STATE")" = "$CANDIDATE_SOURCE_CI_RUN_ATTEMPT"
            test "$(jq -r .event <<<"$CANDIDATE_SOURCE_CI_STATE")" = push
            test "$(jq -r .head_branch <<<"$CANDIDATE_SOURCE_CI_STATE")" = main
            test "$(jq -r .head_sha <<<"$CANDIDATE_SOURCE_CI_STATE")" = "$RELEASE_SHA"
            test "$(jq -r .conclusion <<<"$CANDIDATE_SOURCE_CI_STATE")" = success
            test "$(jq -r .name <<<"$CANDIDATE_STATE")" = "Publish Python wheel"
            test "$(jq -r .path <<<"$CANDIDATE_STATE")" = .github/workflows/wheel.yml
            test "$(jq -r .run_attempt <<<"$CANDIDATE_STATE")" = "$CANDIDATE_RUN_ATTEMPT"
            test "$(jq -r .event <<<"$CANDIDATE_STATE")" = workflow_run
            test "$(jq -r .head_repository.full_name <<<"$CANDIDATE_STATE")" = "${{ github.repository }}"
            test "$(jq -r .head_branch <<<"$CANDIDATE_STATE")" = main
            test "$(jq -r .conclusion <<<"$CANDIDATE_STATE")" = success
          done < <(jq -r '.[] | [.id, .workflow_run.id] | @tsv' "$RUNNER_TEMP/wheel-artifacts.json")
          python scripts/wheel_artifact.py select \
            --candidates "$CANDIDATES" \
            --output dist/application-wheel \
            --repository "${{ github.repository }}" \
            --version "$VERSION" \
            --commit "$RELEASE_SHA" \
            > "$RUNNER_TEMP/selected-wheel-identity.json"
          SOURCE_CI_RUN_ID="$(jq -r .source_ci.run_id "$RUNNER_TEMP/selected-wheel-identity.json")"
          SOURCE_CI_RUN_ATTEMPT="$(jq -r .source_ci.run_attempt "$RUNNER_TEMP/selected-wheel-identity.json")"
          PUBLISHER_RUN_ID="$(jq -r .publisher.run_id "$RUNNER_TEMP/selected-wheel-identity.json")"
          PUBLISHER_RUN_ATTEMPT="$(jq -r .publisher.run_attempt "$RUNNER_TEMP/selected-wheel-identity.json")"
          SOURCE_CI_STATE="$(gh api "repos/${{ github.repository }}/actions/runs/${SOURCE_CI_RUN_ID}/attempts/${SOURCE_CI_RUN_ATTEMPT}")"
          PUBLISHER_STATE="$(gh api "repos/${{ github.repository }}/actions/runs/${PUBLISHER_RUN_ID}/attempts/${PUBLISHER_RUN_ATTEMPT}")"
          test "$(jq -r .name <<<"$SOURCE_CI_STATE")" = CI
          test "$(jq -r .path <<<"$SOURCE_CI_STATE")" = .github/workflows/ci.yml
          test "$(jq -r .run_attempt <<<"$SOURCE_CI_STATE")" = "$SOURCE_CI_RUN_ATTEMPT"
          test "$(jq -r .event <<<"$SOURCE_CI_STATE")" = push
          test "$(jq -r .head_branch <<<"$SOURCE_CI_STATE")" = main
          test "$(jq -r .head_sha <<<"$SOURCE_CI_STATE")" = "$RELEASE_SHA"
          test "$(jq -r .conclusion <<<"$SOURCE_CI_STATE")" = success
          test "$(jq -r .name <<<"$PUBLISHER_STATE")" = "Publish Python wheel"
          test "$(jq -r .path <<<"$PUBLISHER_STATE")" = .github/workflows/wheel.yml
          test "$(jq -r .run_attempt <<<"$PUBLISHER_STATE")" = "$PUBLISHER_RUN_ATTEMPT"
          test "$(jq -r .event <<<"$PUBLISHER_STATE")" = workflow_run
          test "$(jq -r .head_repository.full_name <<<"$PUBLISHER_STATE")" = "${{ github.repository }}"
          test "$(jq -r .head_branch <<<"$PUBLISHER_STATE")" = main
          test "$(jq -r .conclusion <<<"$PUBLISHER_STATE")" = success
      - name: Preserve an existing immutable release
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.target.outputs.release_sha }}
          RELEASE_KEY_ID: atlaso-release-2026-01
        run: |
          VERSION="$(jq -r .version dist/application-wheel/wheel-identity.json)"
          test -n "$VERSION"
          TAG="v${VERSION}"
          if ! gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p dist/release
          gh release download "$TAG" --dir dist/release
          test "$(find dist/release -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' \
            "atlaso-appliance-${VERSION}.tar.gz" \
            "atlaso-third-party-notices-${VERSION}.md" \
            release-manifest.json \
            release-manifest.json.sig | sort)"
          python scripts/prepare_virtualization_source.py \
            --manifest dist/release/release-manifest.json \
            --signature dist/release/release-manifest.json.sig \
            --bundle "dist/release/atlaso-appliance-${VERSION}.tar.gz" \
            --trust-key "image/common/update-trust/${RELEASE_KEY_ID}.pem" \
            --output "$RUNNER_TEMP/existing-release-inputs" \
            --expected-version "$VERSION" \
            --expected-commit "$RELEASE_SHA" \
            > "$RUNNER_TEMP/existing-release-inputs.json"
          EXISTING_WHEEL="$(jq -r .application_wheel "$RUNNER_TEMP/existing-release-inputs.json")"
          SELECTED_WHEEL="$(find dist/application-wheel -maxdepth 1 -type f -name '*.whl')"
          EXISTING_NOTICE="dist/release/atlaso-third-party-notices-${VERSION}.md"
          NOTICE_SHA="$(jq -er '.content_hashes["THIRD_PARTY_NOTICES.md"] | select(type == "string" and test("^[0-9a-f]{64}$"))' dist/release/release-manifest.json)"
          test -f "$EXISTING_WHEEL"
          test -f "$SELECTED_WHEEL"
          test -f "$EXISTING_NOTICE"
          test "$(sha256sum "$EXISTING_WHEEL" | cut -d' ' -f1)" = \
            "$(sha256sum "$SELECTED_WHEEL" | cut -d' ' -f1)"
          test "$(sha256sum "$EXISTING_NOTICE" | cut -d' ' -f1)" = "$NOTICE_SHA"
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Upload verified release inputs
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-inputs
          path: |
            dist/application-wheel
            dist/release
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Sign and publish release
    needs:
      - prepare
      - release_inputs
      - wheelhouse
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.release_inputs.result == 'success' &&
      (needs.release_inputs.outputs.existing_release == 'true' || needs.wheelhouse.result == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: atlaso-github-pages
      queue: max
      cancel-in-progress: false
    environment: appliance-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
      - name: Check out protected release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: protected-tooling
      - name: Confirm the commit is still on main
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install locked release tooling
        env:
          PIP_CONFIG_FILE: /dev/null
        run: python -m pip install --require-hashes --requirement requirements-release-tools.lock
      - name: Download verified release inputs
        uses: actions/download-artifact@v8
        with:
          name: verified-release-inputs
          path: dist
      - name: Confirm verified release input transfer
        env:
          EXISTING_RELEASE: ${{ needs.release_inputs.outputs.existing_release }}
        run: |
          test "$(find dist/application-wheel -maxdepth 1 -type f -name 'atlaso-*.whl' | wc -l)" -eq 1
          test -s dist/application-wheel/wheel-identity.json
          if test "$EXISTING_RELEASE" = true; then
            VERSION="$(python scripts/version.py get)"
            test "$(find dist/release -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' \
              "atlaso-appliance-${VERSION}.tar.gz" \
              "atlaso-third-party-notices-${VERSION}.md" \
              release-manifest.json \
              release-manifest.json.sig | sort)"
          else
            test ! -d dist/release || test -z "$(find dist/release -type f -print -quit)"
          fi
      - name: Download CPython 3.14 wheelhouse
        if: needs.release_inputs.outputs.existing_release != 'true'
        uses: actions/download-artifact@v8
        with:
          name: wheelhouse-cp314
          path: wheelhouses/cp314
      - name: Materialize the protected signing key
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/release-signing-key.pem"
      - name: Build and sign the immutable release
        if: needs.release_inputs.outputs.existing_release != 'true'
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_KEY_ID: atlaso-release-2026-01
        run: |
          BUILT_AT="$(git show -s --format=%cI "$RELEASE_SHA")"
          python scripts/build_release_bundle.py \
            --wheelhouses wheelhouses \
            --application-wheel-root dist/application-wheel \
            --signing-key "$RUNNER_TEMP/release-signing-key.pem" \
            --signing-key-id "$RELEASE_KEY_ID" \
            --commit "$RELEASE_SHA" \
            --built-at "$BUILT_AT"
      - name: Publish the idempotent tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python scripts/publish_release.py --commit "$RELEASE_SHA" --assets dist/release
      - name: Advance the signed development channel
        env:
          RELEASE_KEY_ID: atlaso-release-2026-01
        run: |
          VERSION="$(python scripts/version.py get)"
          SITE_ROOT="$RUNNER_TEMP/site"
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "$SITE_ROOT" 2>/dev/null || git init "$SITE_ROOT"
          if test "$VERSION" = "0.9.18"; then
            git -C "$SITE_ROOT" rm -r --ignore-unmatch .
          fi
          python protected-tooling/scripts/promote_release_channel.py \
            --channel development \
            --expected-version "$VERSION" \
            --release-manifest-url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/release-manifest.json" \
            --release-manifest dist/release/release-manifest.json \
            --release-signature dist/release/release-manifest.json.sig \
            --trusted-key image/common/update-trust/${RELEASE_KEY_ID}.pem \
            --site-root "$SITE_ROOT/updates" \
            --signing-key "$RUNNER_TEMP/release-signing-key.pem" \
            --signing-key-id "$RELEASE_KEY_ID" \
            --refuse-downgrade
          install -m 0644 docs/assets/brand/atlaso-logo-horizontal-light.svg "$SITE_ROOT/atlaso-logo.svg"
          cat > "$SITE_ROOT/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Atlaso Release Repository</title>
            <style>
              :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
              body { margin: 0; background: #f3f8fb; color: #071a3a; }
              main { width: min(720px, calc(100% - 40px)); margin: 12vh auto; }
              article { padding: 40px; background: #fff; border: 1px solid #cbdce8; border-radius: 18px; box-shadow: 0 18px 50px rgb(7 26 58 / 10%); }
              .logo { width: min(320px, 80%); height: auto; margin-bottom: 28px; }
              p { line-height: 1.65; color: #38506c; }
              h1 { margin: 8px 0 12px; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.05; letter-spacing: -.04em; }
              .eyebrow { color: #1769e0; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
              .capabilities { color: #008f95; font-weight: 700; }
              .source { display: block; overflow-wrap: anywhere; margin: 24px 0; padding: 14px 16px; background: #edf8fa; border-radius: 10px; color: #071a3a; }
              nav { display: flex; flex-wrap: wrap; gap: 12px; }
              a { color: #1769e0; font-weight: 650; text-decoration: none; }
              a:hover, a:focus-visible { text-decoration: underline; }
              footer { margin-top: 28px; font-size: .875rem; }
            </style>
          </head>
          <body>
            <main>
              <article>
                <img class="logo" src="./atlaso-logo.svg" alt="Atlaso">
                <div class="eyebrow">Atlaso appliance updates</div>
                <h1>Everything your virtualization lab needs.</h1>
                <p class="capabilities">Infrastructure • Storage • Identity • Networking • Lifecycle</p>
                <p>Atlaso supports POC, lab, and test environments by simplifying deployment, maintenance, and validation. This site publishes machine-readable channel pointers for transactional Atlaso appliance updates.</p>
                <code class="source">https://mdaneri.github.io/Atlaso/updates</code>
                <nav aria-label="Release repository links">
                  <a href="./docs/">Documentation</a>
                  <a href="./updates/channels/development/manifest.json">Development channel</a>
                  <a href="https://github.com/mdaneri/Atlaso/releases">GitHub Releases</a>
                  <a href="https://github.com/mdaneri/Atlaso">Source repository</a>
                </nav>
                <footer><p>The HTML page is informational. Signed JSON documents under <code>/updates</code> remain the appliance protocol.</p></footer>
              </article>
            </main>
          </body>
          </html>
          EOF
          touch "$SITE_ROOT/.nojekyll"
          test -s "$SITE_ROOT/updates/channels/stable/manifest.json"
          test -s "$SITE_ROOT/updates/channels/stable/manifest.json.sig"
          git -C "$SITE_ROOT" add --all
          if git -C "$SITE_ROOT" diff --cached --quiet; then
            exit 0
          fi
          git -C "$SITE_ROOT" config user.name github-actions[bot]
          git -C "$SITE_ROOT" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$SITE_ROOT" commit -m "Advance development to v${VERSION}"
          if git -C "$SITE_ROOT" remote get-url origin >/dev/null 2>&1; then
            git -C "$SITE_ROOT" push origin HEAD:gh-pages
          else
            git -C "$SITE_ROOT" remote add origin \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            git -C "$SITE_ROOT" push origin HEAD:gh-pages
          fi
      - name: Verify the published development channel
        env:
          RELEASE_KEY_ID: atlaso-release-2026-01
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          VERSION="$(python scripts/version.py get)"
          python scripts/check_published_release_channel.py \
            --channel-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/updates/channels/development/manifest.json" \
            --expected-channel development \
            --expected-version "$VERSION" \
            --expected-commit "$RELEASE_SHA" \
            --trusted-key "image/common/update-trust/${RELEASE_KEY_ID}.pem"
