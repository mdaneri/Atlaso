name: Publish appliance release

on:
  workflow_run:
    workflows:
      - Publish Python wheel
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_sha:
        description: Successful main CI commit to publish or recover
        required: true
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: appliance-release-${{ inputs.release_sha || github.event.workflow_run.id }}
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release target
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.target.outputs.release_sha }}
      eligible: ${{ steps.target.outputs.eligible }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - name: Check out protected main admission tooling
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate successful main CI release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PUBLISHER_RUN_ID: ${{ github.event.workflow_run.id }}
          PUBLISHER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          if test "${{ github.event_name }}" = workflow_run; then
            PUBLISHER_ARTIFACTS="$(gh api \
              "repos/${{ github.repository }}/actions/runs/${PUBLISHER_RUN_ID}/artifacts")"
            CANDIDATE_ARTIFACTS="$(jq -r \
              '.artifacts[] |
               select(.expired == false and
                 (.name | test("^atlaso-wheel-v[0-9]+\\.[0-9]+\\.[0-9]+-[0-9a-f]{40}$"))) |
               [.id, .name] | @tsv' \
              <<<"$PUBLISHER_ARTIFACTS")"
            test -n "$CANDIDATE_ARTIFACTS"
            SELECTED_ARTIFACTS=0
            while IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_NAME; do
              CANDIDATE_ZIP="$RUNNER_TEMP/automatic-wheel-${ARTIFACT_ID}.zip"
              CANDIDATE_IDENTITY="$RUNNER_TEMP/automatic-wheel-identity-${ARTIFACT_ID}.json"
              gh api "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
                > "$CANDIDATE_ZIP"
              CANDIDATE_MEMBERS="$(unzip -Z1 "$CANDIDATE_ZIP" | sort)"
              CANDIDATE_WHEEL="$(grep -E '^atlaso-[0-9]+\.[0-9]+\.[0-9]+-py3-none-any\.whl$' \
                <<<"$CANDIDATE_MEMBERS" || true)"
              if test -z "$CANDIDATE_WHEEL" || test "$CANDIDATE_MEMBERS" != \
                "$(printf '%s\n' "$CANDIDATE_WHEEL" wheel-identity.json | sort)"; then
                continue
              fi
              unzip -p "$CANDIDATE_ZIP" wheel-identity.json > "$CANDIDATE_IDENTITY"
              CANDIDATE_CANONICAL="$(jq -cS . "$CANDIDATE_IDENTITY")"
              if test "$CANDIDATE_CANONICAL" != "$(cat "$CANDIDATE_IDENTITY")"; then
                continue
              fi
              if test "$(jq -r .publisher.run_id <<<"$CANDIDATE_CANONICAL")" = "$PUBLISHER_RUN_ID" && \
                test "$(jq -r .publisher.run_attempt <<<"$CANDIDATE_CANONICAL")" = "$PUBLISHER_RUN_ATTEMPT"; then
                SELECTED_ARTIFACTS=$((SELECTED_ARTIFACTS + 1))
                cp "$CANDIDATE_ZIP" "$RUNNER_TEMP/automatic-wheel.zip"
                cp "$CANDIDATE_IDENTITY" "$RUNNER_TEMP/automatic-wheel-identity.json"
                SELECTED_ARTIFACT_NAME="$ARTIFACT_NAME"
                SELECTED_WHEEL="$CANDIDATE_WHEEL"
              fi
            done <<<"$CANDIDATE_ARTIFACTS"
            test "$SELECTED_ARTIFACTS" -eq 1
            IDENTITY="$(jq -cS . "$RUNNER_TEMP/automatic-wheel-identity.json")"
            test "$IDENTITY" = "$(cat "$RUNNER_TEMP/automatic-wheel-identity.json")"
            RELEASE_SHA="$(jq -r .commit <<<"$IDENTITY")"
            VERSION="$(jq -r .version <<<"$IDENTITY")"
            test "$(jq -r .repository <<<"$IDENTITY")" = "${{ github.repository }}"
            test "$(jq -r .publisher.workflow <<<"$IDENTITY")" = "Publish Python wheel"
            test "$(jq -r .publisher.workflow_file <<<"$IDENTITY")" = wheel.yml
            test "$(jq -r .publisher.run_id <<<"$IDENTITY")" = "$PUBLISHER_RUN_ID"
            test "$(jq -r .publisher.run_attempt <<<"$IDENTITY")" = "$PUBLISHER_RUN_ATTEMPT"
            test "$(jq -r .publisher.trigger <<<"$IDENTITY")" = automatic-main
            test "$SELECTED_ARTIFACT_NAME" = "atlaso-wheel-v${VERSION}-${RELEASE_SHA}"
            test "$SELECTED_WHEEL" = "atlaso-${VERSION}-py3-none-any.whl"
          fi
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Release SHA must be a full lowercase hexadecimal commit."
            exit 1
          fi
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          VERSION="$(git show "${RELEASE_SHA}:pyproject.toml" | python -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ELIGIBLE=true
          if test "${{ github.event_name }}" = workflow_run && [[ "$VERSION" == 0.* ]]; then
            ELIGIBLE=false
          fi
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          printf '{"release_sha":"%s"}\n' "$RELEASE_SHA" > validated-release-request.json
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload the validated release request
        uses: actions/upload-artifact@v7
        with:
          name: validated-release-request
          path: validated-release-request.json
          if-no-files-found: error
          retention-days: 1

  wheelhouse:
    name: Build ${{ matrix.abi }} wheelhouse
    needs:
      - prepare
      - release_inputs
    if: needs.release_inputs.outputs.existing_release != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - python: '3.14'
            abi: cp314
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install exact locked wheel build tools
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install --require-hashes --upgrade --requirement requirements-release-tools.lock
          python -m pip install --require-hashes --upgrade --requirement requirements-appliance-bootstrap.lock
      - name: Build the exact locked wheelhouse
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_SHA")"
          python -m pip wheel \
            --require-hashes \
            --no-build-isolation \
            --wheel-dir wheelhouse/${{ matrix.abi }} \
            --requirement requirements-appliance.lock
          python scripts/write_wheelhouse_lock.py --wheelhouse wheelhouse/${{ matrix.abi }}
      - name: Upload wheelhouse
        uses: actions/upload-artifact@v7
        with:
          name: wheelhouse-${{ matrix.abi }}
          path: wheelhouse/${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 7

  release_inputs:
    name: Resolve immutable release inputs
    needs:
      - prepare
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    outputs:
      existing_release: ${{ steps.existing_release.outputs.present }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the validated release request
        uses: actions/download-artifact@v8
        with:
          name: validated-release-request
          path: validated-release-request
      - name: Read the validated release target
        id: target
        run: |
          REQUEST=validated-release-request/validated-release-request.json
          test "$(jq -cS . "$REQUEST")" = "$(cat "$REQUEST")"
          test "$(jq -r 'keys | join(",")' "$REQUEST")" = release_sha
          RELEASE_SHA="$(jq -r .release_sha "$REQUEST")"
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Validated release request has an invalid commit."
            exit 1
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Check out protected main release tooling
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the validated commit is still on main
        env:
          RELEASE_SHA: ${{ steps.target.outputs.release_sha }}
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install locked release tooling
        env:
          PIP_CONFIG_FILE: /dev/null
        run: python -m pip install --require-hashes --requirement requirements-release-tools.lock
      - name: Resolve the immutable automatic wheel handoff
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.target.outputs.release_sha }}
        run: |
          VERSION="$(
            git show "${RELEASE_SHA}:pyproject.toml" |
              sed -nE '/^\[project\]$/,/^\[/ s/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' |
              head -n 1
          )"
          test -n "$VERSION"
          ARTIFACT_NAME="atlaso-wheel-v${VERSION}-${RELEASE_SHA}"
          CANDIDATES="$RUNNER_TEMP/wheel-candidates"
          mkdir -p "$CANDIDATES"
          gh api --paginate --slurp \
            "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
            > "$RUNNER_TEMP/wheel-artifact-pages.json"
          jq '[.[].artifacts[] | select(.expired == false and .name == "'"$ARTIFACT_NAME"'")]' \
            "$RUNNER_TEMP/wheel-artifact-pages.json" \
            > "$RUNNER_TEMP/wheel-artifacts.json"
          if test "$(jq length "$RUNNER_TEMP/wheel-artifacts.json")" -lt 1; then
            echo "::error::No retained automatic wheel artifact exists for $RELEASE_SHA at v$VERSION."
            exit 1
          fi
          while IFS=$'\t' read -r ARTIFACT_ID PUBLISHER_RUN_ID; do
            TARGET="$CANDIDATES/$PUBLISHER_RUN_ID-$ARTIFACT_ID"
            if test -e "$TARGET"; then
              echo "::error::Automatic wheel artifact $ARTIFACT_ID was returned more than once."
              exit 1
            fi
            mkdir "$TARGET"
            gh api "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > "$RUNNER_TEMP/wheel-${ARTIFACT_ID}.zip"
            python scripts/wheel_artifact.py extract \
              --archive "$RUNNER_TEMP/wheel-${ARTIFACT_ID}.zip" \
              --output "$TARGET"
            CANDIDATE_SOURCE_CI_RUN_ID="$(jq -r .source_ci.run_id "$TARGET/wheel-identity.json")"
            CANDIDATE_SOURCE_CI_RUN_ATTEMPT="$(jq -r .source_ci.run_attempt "$TARGET/wheel-identity.json")"
            CANDIDATE_RUN_ID="$(jq -r .publisher.run_id "$TARGET/wheel-identity.json")"
            CANDIDATE_RUN_ATTEMPT="$(jq -r .publisher.run_attempt "$TARGET/wheel-identity.json")"
            test "$CANDIDATE_RUN_ID" = "$PUBLISHER_RUN_ID"
            CANDIDATE_SOURCE_CI_STATE="$(
              gh api \
                "repos/${{ github.repository }}/actions/runs/${CANDIDATE_SOURCE_CI_RUN_ID}/attempts/${CANDIDATE_SOURCE_CI_RUN_ATTEMPT}"
            )"
            CANDIDATE_STATE="$(gh api "repos/${{ github.repository }}/actions/runs/${CANDIDATE_RUN_ID}/attempts/${CANDIDATE_RUN_ATTEMPT}")"
            test "$(jq -r .name <<<"$CANDIDATE_SOURCE_CI_STATE")" = CI
            test "$(jq -r .path <<<"$CANDIDATE_SOURCE_CI_STATE")" = .github/workflows/ci.yml
            test "$(jq -r .run_attempt <<<"$CANDIDATE_SOURCE_CI_STATE")" = "$CANDIDATE_SOURCE_CI_RUN_ATTEMPT"
            test "$(jq -r .event <<<"$CANDIDATE_SOURCE_CI_STATE")" = push
            test "$(jq -r .head_branch <<<"$CANDIDATE_SOURCE_CI_STATE")" = main
            test "$(jq -r .head_sha <<<"$CANDIDATE_SOURCE_CI_STATE")" = "$RELEASE_SHA"
            test "$(jq -r .conclusion <<<"$CANDIDATE_SOURCE_CI_STATE")" = success
            test "$(jq -r .name <<<"$CANDIDATE_STATE")" = "Publish Python wheel"
            test "$(jq -r .path <<<"$CANDIDATE_STATE")" = .github/workflows/wheel.yml
            test "$(jq -r .run_attempt <<<"$CANDIDATE_STATE")" = "$CANDIDATE_RUN_ATTEMPT"
            test "$(jq -r .event <<<"$CANDIDATE_STATE")" = workflow_run
            test "$(jq -r .head_repository.full_name <<<"$CANDIDATE_STATE")" = "${{ github.repository }}"
            test "$(jq -r .head_branch <<<"$CANDIDATE_STATE")" = main
            test "$(jq -r .conclusion <<<"$CANDIDATE_STATE")" = success
          done < <(jq -r '.[] | [.id, .workflow_run.id] | @tsv' "$RUNNER_TEMP/wheel-artifacts.json")
          SELECT_PUBLISHER_ARGS=()
          if test "${{ github.event_name }}" = workflow_run; then
            SELECT_PUBLISHER_ARGS=(
              --publisher-trigger automatic-main
            )
          fi
          python scripts/wheel_artifact.py select \
            --candidates "$CANDIDATES" \
            --output dist/application-wheel \
            --repository "${{ github.repository }}" \
            --version "$VERSION" \
            --commit "$RELEASE_SHA" \
            "${SELECT_PUBLISHER_ARGS[@]}" \
            > "$RUNNER_TEMP/selected-wheel-identity.json"
          SOURCE_CI_RUN_ID="$(jq -r .source_ci.run_id "$RUNNER_TEMP/selected-wheel-identity.json")"
          SOURCE_CI_RUN_ATTEMPT="$(jq -r .source_ci.run_attempt "$RUNNER_TEMP/selected-wheel-identity.json")"
          PUBLISHER_RUN_ID="$(jq -r .publisher.run_id "$RUNNER_TEMP/selected-wheel-identity.json")"
          PUBLISHER_RUN_ATTEMPT="$(jq -r .publisher.run_attempt "$RUNNER_TEMP/selected-wheel-identity.json")"
          SOURCE_CI_STATE="$(gh api "repos/${{ github.repository }}/actions/runs/${SOURCE_CI_RUN_ID}/attempts/${SOURCE_CI_RUN_ATTEMPT}")"
          PUBLISHER_STATE="$(gh api "repos/${{ github.repository }}/actions/runs/${PUBLISHER_RUN_ID}/attempts/${PUBLISHER_RUN_ATTEMPT}")"
          test "$(jq -r .name <<<"$SOURCE_CI_STATE")" = CI
          test "$(jq -r .path <<<"$SOURCE_CI_STATE")" = .github/workflows/ci.yml
          test "$(jq -r .run_attempt <<<"$SOURCE_CI_STATE")" = "$SOURCE_CI_RUN_ATTEMPT"
          test "$(jq -r .event <<<"$SOURCE_CI_STATE")" = push
          test "$(jq -r .head_branch <<<"$SOURCE_CI_STATE")" = main
          test "$(jq -r .head_sha <<<"$SOURCE_CI_STATE")" = "$RELEASE_SHA"
          test "$(jq -r .conclusion <<<"$SOURCE_CI_STATE")" = success
          test "$(jq -r .name <<<"$PUBLISHER_STATE")" = "Publish Python wheel"
          test "$(jq -r .path <<<"$PUBLISHER_STATE")" = .github/workflows/wheel.yml
          test "$(jq -r .run_attempt <<<"$PUBLISHER_STATE")" = "$PUBLISHER_RUN_ATTEMPT"
          test "$(jq -r .event <<<"$PUBLISHER_STATE")" = workflow_run
          test "$(jq -r .head_repository.full_name <<<"$PUBLISHER_STATE")" = "${{ github.repository }}"
          test "$(jq -r .head_branch <<<"$PUBLISHER_STATE")" = main
          test "$(jq -r .conclusion <<<"$PUBLISHER_STATE")" = success
      - name: Check whether the exact release exists
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r .version dist/application-wheel/wheel-identity.json)"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          STATE="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$tag:String!){repository(owner:$owner,name:$repo){release(tagName:$tag){isDraft}}}' \
            -f owner="$OWNER" -f repo="$REPO" -f tag="v$VERSION")"
          jq -e '.data.repository != null' <<<"$STATE"
          echo "present=$(jq '.data.repository.release != null' <<<"$STATE")" >> "$GITHUB_OUTPUT"
      - name: Upload verified release inputs
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-inputs
          path: dist/application-wheel
          if-no-files-found: error
          retention-days: 1

  stage:
    name: Build or verify the signed release draft
    needs: [prepare, release_inputs, wheelhouse]
    if: >-
      ${{ !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.release_inputs.result == 'success' &&
      (needs.release_inputs.outputs.existing_release == 'true' || needs.wheelhouse.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: atlaso-installation-stage-v${{ needs.prepare.outputs.version }}
      queue: max
      cancel-in-progress: false
    environment: appliance-release
    permissions:
      actions: read
      contents: write
    outputs:
      legacy: ${{ steps.state.outputs.legacy }}
      iso_assets: ${{ steps.iso-assets.outputs.inventory }}
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_KEY_ID: atlaso-release-2026-01
    steps:
      - name: Check out protected release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Confirm target is still on main
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install locked release tooling
        env:
          PIP_CONFIG_FILE: /dev/null
        run: python -m pip install --require-hashes --requirement requirements-release-tools.lock
      - name: Download verified wheel handoff
        uses: actions/download-artifact@v8
        with:
          name: verified-release-inputs
          path: dist/application-wheel
      - name: Reuse an existing verified draft or release
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE="$(python -m scripts.installation.combined_release state --tag "v$VERSION" --commit "$RELEASE_SHA")"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          if test "$STATE" != absent; then
            mapfile -t WHEELS < <(find dist/application-wheel -maxdepth 1 -type f -name 'atlaso-*.whl')
            test "${#WHEELS[@]}" -eq 1
            ISO="$(python -m scripts.installation.combined_release verify --tag "v$VERSION" --commit "$RELEASE_SHA" \
              --assets "$RUNNER_TEMP/existing-release" --scratch "$RUNNER_TEMP/existing-verification" --wheel "${WHEELS[0]}")"
            if test "$ISO" = legacy; then
              echo "legacy=true" >> "$GITHUB_OUTPUT"
            else
              printf 'Verified %s %s. ISO SHA-256: \`%s\`\n' "$STATE" "v$VERSION" "$ISO" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Check out exact software source
        if: steps.state.outputs.state == 'absent'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
          path: target-source
      - name: Download CPython 3.14 wheelhouse
        if: steps.state.outputs.state == 'absent'
        uses: actions/download-artifact@v8
        with:
          name: wheelhouse-cp314
          path: wheelhouses/cp314
      - name: Install pinned ORAS CLI
        if: steps.state.outputs.state == 'absent'
        run: |
          ORAS_ARCHIVE="$RUNNER_TEMP/oras_1.3.6_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --output "$ORAS_ARCHIVE" \
            https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
          printf '%s  %s\n' '66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0' \
            "$ORAS_ARCHIVE" | sha256sum --check
          mkdir "$RUNNER_TEMP/oras-bin"
          tar -xzf "$ORAS_ARCHIVE" --directory "$RUNNER_TEMP/oras-bin" oras
          echo "$RUNNER_TEMP/oras-bin" >> "$GITHUB_PATH"
      - name: Pull the pinned private installation capture
        if: steps.state.outputs.state == 'absent'
        env:
          INSTALLATION_CAPTURE_DIGEST: ${{ vars.INSTALLATION_CAPTURE_DIGEST }}
          INSTALLATION_CAPTURE_SHA256: ${{ vars.INSTALLATION_CAPTURE_SHA256 }}
          INSTALLATION_CAPTURE_USERNAME: ${{ vars.INSTALLATION_CAPTURE_USERNAME }}
          INSTALLATION_CAPTURE_TOKEN: ${{ secrets.INSTALLATION_CAPTURE_TOKEN }}
        run: |
          if ! [[ "$INSTALLATION_CAPTURE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ &&
                  "$INSTALLATION_CAPTURE_SHA256" =~ ^[0-9a-f]{64}$ &&
                  -n "$INSTALLATION_CAPTURE_TOKEN" && -n "$INSTALLATION_CAPTURE_USERNAME" ]]; then
            echo 'Protected installation capture configuration is missing or invalid' >&2
            exit 1
          fi
          CAPTURE_REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/atlaso-installation-capture"
          CAPTURE_BLOB="sha256:$INSTALLATION_CAPTURE_SHA256"
          CAPTURE_MANIFEST="$RUNNER_TEMP/capture-manifest.json"
          if ! printf '%s\n' "$INSTALLATION_CAPTURE_TOKEN" |
            env -u INSTALLATION_CAPTURE_TOKEN oras manifest fetch --password-stdin \
              --username "$INSTALLATION_CAPTURE_USERNAME" --output "$CAPTURE_MANIFEST" \
              "$CAPTURE_REPO@$INSTALLATION_CAPTURE_DIGEST" >/dev/null 2>&1; then
            echo 'Could not download the pinned GHCR capture manifest' >&2
            exit 1
          fi
          printf '%s  %s\n' "${INSTALLATION_CAPTURE_DIGEST#sha256:}" "$CAPTURE_MANIFEST" | sha256sum --check
          CAPTURE_LIMIT="$(( $(stat -f -c '%a * %S' "$RUNNER_TEMP") - 2 * 1024**3 ))"
          jq -e --arg blob "$CAPTURE_BLOB" --argjson limit "$CAPTURE_LIMIT" '
            .schemaVersion == 2 and
            .mediaType == "application/vnd.oci.image.manifest.v1+json" and
            .artifactType == "application/vnd.atlaso.installation.capture.v1" and
            (.layers | length == 1) and
            (.layers[0] | .digest == $blob and .mediaType == "application/gzip" and
              (.size | type == "number" and . > 0 and . <= $limit and . <= 17179869184))
          ' "$CAPTURE_MANIFEST" >/dev/null
          if ! printf '%s\n' "$INSTALLATION_CAPTURE_TOKEN" |
            env -u INSTALLATION_CAPTURE_TOKEN oras blob fetch --password-stdin \
              --username "$INSTALLATION_CAPTURE_USERNAME" --output "$RUNNER_TEMP/capture.tar.gz" \
              "$CAPTURE_REPO@$CAPTURE_BLOB" >/dev/null 2>&1; then
            echo 'Could not download the pinned GHCR capture archive' >&2
            exit 1
          fi
      - name: Admit protected native inputs and pinned Photon media
        id: native-inputs
        if: steps.state.outputs.state == 'absent'
        env:
          INSTALLATION_CAPTURE_SHA256: ${{ vars.INSTALLATION_CAPTURE_SHA256 }}
        run: |
          SNAPSHOT_SHA256="$(python -m scripts.installation.release_capture admit --archive "$RUNNER_TEMP/capture.tar.gz" \
            --sha256 "$INSTALLATION_CAPTURE_SHA256" --require-snapshot \
            --output "$RUNNER_TEMP/capture" --target target-source)"
          [[ "$SNAPSHOT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "snapshot_sha256=$SNAPSHOT_SHA256" >> "$GITHUB_OUTPUT"
          mv "$RUNNER_TEMP/capture/photon-snapshot.json" "$RUNNER_TEMP/photon-snapshot.json"
          rm -- "$RUNNER_TEMP/capture.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/photon.iso" \
            https://packages.broadcom.com/photon/5.0/GA/iso/photon-5.0-dde71ec57.x86_64.iso
          python -m scripts.installation.release_capture check-capacity \
            --capture "$RUNNER_TEMP/capture" --source-iso "$RUNNER_TEMP/photon.iso"
      - name: Install native ISO build tools
        if: steps.state.outputs.state == 'absent'
        env:
          PIP_CONFIG_FILE: /dev/null
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rpm rpm2cpio cpio createrepo-c
          python -m venv "$RUNNER_TEMP/iso-python"
          "$RUNNER_TEMP/iso-python/bin/python" -m pip install --require-hashes --requirement target-source/requirements-appliance.lock
      - name: Build and sign the exact software bundle
        if: steps.state.outputs.state == 'absent'
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f -- "$RUNNER_TEMP/release-signing-key.pem"' EXIT
          unset RELEASE_SIGNING_PRIVATE_KEY
          cd target-source
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          BUILT_AT="$(git show -s --format=%cI "$RELEASE_SHA")"
          python scripts/build_release_bundle.py \
            --wheelhouses ../wheelhouses --application-wheel-root ../dist/application-wheel \
            --signing-key "$RUNNER_TEMP/release-signing-key.pem" --signing-key-id "$RELEASE_KEY_ID" \
            --commit "$RELEASE_SHA" --built-at "$BUILT_AT" --repository "$GITHUB_REPOSITORY"
      - name: Prepare and independently validate offline installer inputs
        if: steps.state.outputs.state == 'absent'
        env:
          SNAPSHOT_SHA256: ${{ steps.native-inputs.outputs.snapshot_sha256 }}
        run: |
          mv target-source/dist/release dist/release
          python scripts/prepare_virtualization_source.py \
            --manifest dist/release/release-manifest.json --signature dist/release/release-manifest.json.sig \
            --bundle "dist/release/atlaso-appliance-$VERSION.tar.gz" \
            --trust-key "image/common/update-trust/$RELEASE_KEY_ID.pem" \
            --output "$RUNNER_TEMP/software" --expected-version "$VERSION" --expected-commit "$RELEASE_SHA"
          "$RUNNER_TEMP/iso-python/bin/python" scripts/build_installation_iso.py prepare --commit "$RELEASE_SHA" --version "$VERSION" \
            --software "$RUNNER_TEMP/software" --payload "$RUNNER_TEMP/payload" \
            --rpms "$RUNNER_TEMP/capture/rpms" --powercli "$RUNNER_TEMP/capture/powercli"
          mkdir "$RUNNER_TEMP/iso-validation"
          "$RUNNER_TEMP/iso-python/bin/python" scripts/build_installation_iso.py validate --commit "$RELEASE_SHA" --version "$VERSION" \
            --photon-snapshot "$RUNNER_TEMP/photon-snapshot.json" --photon-snapshot-sha256 "$SNAPSHOT_SHA256" \
            --payload "$RUNNER_TEMP/payload" --scratch "$RUNNER_TEMP/iso-validation"
          rm -rf -- "$RUNNER_TEMP/capture" "$RUNNER_TEMP/software" "$RUNNER_TEMP/iso-validation"
          python -m scripts.installation.release_capture check-capacity \
            --payload "$RUNNER_TEMP/payload" --source-iso "$RUNNER_TEMP/photon.iso"
      - name: Sign and assemble the offline ISO
        if: steps.state.outputs.state == 'absent'
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          SNAPSHOT_SHA256: ${{ steps.native-inputs.outputs.snapshot_sha256 }}
        run: |
          test -n "$RELEASE_SIGNING_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f -- "$RUNNER_TEMP/release-signing-key.pem"' EXIT
          unset RELEASE_SIGNING_PRIVATE_KEY
          mkdir "$RUNNER_TEMP/iso-assets" "$RUNNER_TEMP/iso-build"
          "$RUNNER_TEMP/iso-python/bin/python" scripts/build_installation_iso.py finalize --commit "$RELEASE_SHA" --version "$VERSION" \
            --photon-snapshot "$RUNNER_TEMP/photon-snapshot.json" --photon-snapshot-sha256 "$SNAPSHOT_SHA256" \
            --payload "$RUNNER_TEMP/payload" --source-iso "$RUNNER_TEMP/photon.iso" \
            --output "$RUNNER_TEMP/iso-assets" --scratch "$RUNNER_TEMP/iso-build" \
            --signing-key "$RUNNER_TEMP/release-signing-key.pem" --bind-software
          mv "$RUNNER_TEMP/iso-assets/"* dist/release/
          rm -- "$RUNNER_TEMP/iso-build/atlaso-installation-$VERSION-x86_64.iso"
      - name: Stage combined draft and record its checksum
        if: steps.state.outputs.state == 'absent'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO="$(python -m scripts.installation.combined_release stage --tag "v$VERSION" --commit "$RELEASE_SHA" \
            --assets dist/release --scratch "$RUNNER_TEMP/verify-staged")"
          printf 'Staged draft %s. ISO SHA-256: \`%s\`\n' "v$VERSION" "$ISO" >> "$GITHUB_STEP_SUMMARY"
      - name: Select private draft asset IDs for the acceptance runner
        id: iso-assets
        if: steps.state.outputs.legacy != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INVENTORY="$(python -m scripts.installation.combined_release iso-assets --tag "v$VERSION" --commit "$RELEASE_SHA")"
          echo "inventory=$INVENTORY" >> "$GITHUB_OUTPUT"

  acceptance:
    name: Test the exact signed installer in a disconnected UEFI VM
    needs: [prepare, stage]
    if: github.ref == 'refs/heads/main' && needs.stage.outputs.legacy != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    environment: installation-acceptance
    permissions:
      # GitHub requires this scope to read private draft assets (HTTP 403 with read).
      # Only the download step receives the token. This job has no signing secrets.
      contents: write
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out protected acceptance tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install QEMU, UEFI firmware and console recognition tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 qemu-utils ovmf tesseract-ocr
      - name: Download and verify the signed ISO from the private draft
        id: iso
        env:
          GH_TOKEN: ${{ github.token }}
          INVENTORY: ${{ needs.stage.outputs.iso_assets }}
        run: |
          ASSETS="$RUNNER_TEMP/iso-assets"
          mkdir "$ASSETS"
          jq -e 'type == "array" and length >= 4 and all(.[];
            (.id | type == "number" and . > 0) and
            (.name | test("^(installation-artifact-index\\.json(\\.sig)?|verify-installation\\.pyz|atlaso-installation-[0-9.]+-x86_64\\.iso(\\.part[0-9]{4})?)$")) and
            (.size | type == "number" and . > 0 and . < 2147483648))' <<<"$INVENTORY" >/dev/null
          TOTAL="$(jq 'map(.size) | add' <<<"$INVENTORY")"
          FREE="$(stat -f -c '%a * %S' "$RUNNER_TEMP")"
          test "$((FREE))" -gt "$((TOTAL * 2 + 1024**3))"
          jq -r '.[] | [.id, .name] | @tsv' <<<"$INVENTORY" > "$RUNNER_TEMP/iso-asset-ids.tsv"
          while IFS=$'\t' read -r ID NAME; do
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ID" \
              -H 'Accept: application/octet-stream' > "$ASSETS/$NAME"
          done < "$RUNNER_TEMP/iso-asset-ids.tsv"
          python scripts/verify_installation_iso.py --assets "$ASSETS" \
            --trust-key image/common/update-trust/atlaso-release-2026-01.pem \
            --version "$VERSION" --commit "$RELEASE_SHA" --scratch "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/installation.iso" > "$RUNNER_TEMP/verified-iso.json"
          ISO="$(jq -er '.iso.sha256 | select(test("^[0-9a-f]{64}$"))' "$RUNNER_TEMP/verified-iso.json")"
          echo "sha256=$ISO" >> "$GITHUB_OUTPUT"
          while IFS=$'\t' read -r ID NAME; do
            rm -- "$ASSETS/$NAME"
          done < "$RUNNER_TEMP/iso-asset-ids.tsv"
      - name: Install the pinned 1Password CLI
        run: |
          OP_VERSION=v2.43.0-beta.02
          OP_ARCHIVE="$RUNNER_TEMP/1password-cli.zip"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --output "$OP_ARCHIVE" "https://cache.agilebits.com/dist/1P/op2/pkg/$OP_VERSION/op_linux_amd64_$OP_VERSION.zip"
          printf '%s  %s\n' '831beb2374e08993c5362c179ad4166b7e2ff4d0a8f21c7da6964d6bffdea0ad' \
            "$OP_ARCHIVE" | sha256sum --check
          mkdir "$RUNNER_TEMP/1password-bin"
          unzip -q "$OP_ARCHIVE" op -d "$RUNNER_TEMP/1password-bin"
          echo "$RUNNER_TEMP/1password-bin" >> "$GITHUB_PATH"
      - name: Run installation acceptance and seal the receipt
        env:
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ISO_SHA256: ${{ steps.iso.outputs.sha256 }}
        run: |
          test -n "$OP_ENVIRONMENT_ID" && test -n "$OP_SERVICE_ACCOUNT_TOKEN"
          # Disable masking only for this private pipe. The acceptance process never echoes its input.
          op run --no-masking --environment "$OP_ENVIRONMENT_ID" -- env -u OP_SERVICE_ACCOUNT_TOKEN \
            python -c 'import json, os; print(json.dumps({"admin": os.environ["ATLASO_VM_ADMIN_PASSWORD"], "root": os.environ["ATLASO_VM_ROOT_PASSWORD"]}))' | \
            env -u OP_SERVICE_ACCOUNT_TOKEN -u GH_TOKEN -u GITHUB_TOKEN \
            python -m scripts.installation.vm_acceptance --iso "$RUNNER_TEMP/installation.iso" \
              --sha256 "$ISO_SHA256" --version "$VERSION" --commit "$RELEASE_SHA" \
              --output "$RUNNER_TEMP/vm-fixture" --receipt "$RUNNER_TEMP/vm-acceptance.json"
      - name: Retain exact acceptance evidence
        uses: actions/upload-artifact@v7
        with:
          name: vm-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vm-acceptance.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish the verified GitHub prerelease
    needs: [prepare, stage, acceptance]
    if: >-
      ${{ !cancelled() && needs.stage.result == 'success' &&
      (needs.acceptance.result == 'success' || needs.stage.outputs.legacy == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: atlaso-installation-publish-v${{ needs.prepare.outputs.version }}
      queue: max
      cancel-in-progress: false
    environment: appliance-release
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out protected release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install locked release tooling
        env:
          PIP_CONFIG_FILE: /dev/null
        run: python -m pip install --require-hashes --requirement requirements-release-tools.lock
      - name: Download only this workflow attempt's VM receipt
        if: needs.stage.outputs.legacy != 'true'
        uses: actions/download-artifact@v8
        with:
          name: vm-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acceptance
      - name: Revalidate the complete release and exact VM receipt before publication
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY: ${{ needs.stage.outputs.legacy }}
        run: |
          mkdir dist
          ACCEPTANCE=()
          if test "$LEGACY" != true; then
            ACCEPTANCE=(--vm-acceptance "$RUNNER_TEMP/acceptance/vm-acceptance.json")
          fi
          python -m scripts.installation.combined_release publish --tag "v$VERSION" --commit "$RELEASE_SHA" \
            --assets dist/release --scratch "$RUNNER_TEMP/publication-verification" "${ACCEPTANCE[@]}"

  development:
    name: Advance the authenticated development channel
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: atlaso-github-pages
      queue: max
      cancel-in-progress: false
    environment: appliance-release
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_KEY_ID: atlaso-release-2026-01
    steps:
      - name: Check out protected release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install locked release tooling
        env:
          PIP_CONFIG_FILE: /dev/null
        run: python -m pip install --require-hashes --requirement requirements-release-tools.lock
      - name: Download the verified public release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern release-manifest.json --pattern release-manifest.json.sig --dir dist/release
          jq -e --arg commit "$RELEASE_SHA" '.git_commit == $commit' dist/release/release-manifest.json >/dev/null
      - name: Read the authenticated development pointer
        id: development
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
            git clone --branch gh-pages --single-branch \
              "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/site"
          DECISION="$(python -m scripts.installation.combined_release channel --tag "v$VERSION" --commit "$RELEASE_SHA" \
            --assets "$RUNNER_TEMP/site/updates/channels/development")"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          if test "$DECISION" = skip; then
            echo "The authenticated development pointer already references a newer release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Materialize the protected signing key
        if: steps.development.outputs.decision == 'advance'
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/release-signing-key.pem"
      - name: Advance the signed development channel
        if: steps.development.outputs.decision == 'advance'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SITE_ROOT="$RUNNER_TEMP/site"
          test -s "$SITE_ROOT/updates/channels/stable/manifest.json"
          test -s "$SITE_ROOT/updates/channels/stable/manifest.json.sig"
          python scripts/promote_release_channel.py \
            --channel development \
            --expected-version "$VERSION" \
            --release-manifest-url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/release-manifest.json" \
            --release-manifest dist/release/release-manifest.json \
            --release-signature dist/release/release-manifest.json.sig \
            --trusted-key image/common/update-trust/${RELEASE_KEY_ID}.pem \
            --site-root "$SITE_ROOT/updates" \
            --signing-key "$RUNNER_TEMP/release-signing-key.pem" \
            --signing-key-id "$RELEASE_KEY_ID" \
            --refuse-downgrade
          install -m 0644 docs/assets/brand/atlaso-logo-horizontal-light.svg "$SITE_ROOT/atlaso-logo.svg"
          cat > "$SITE_ROOT/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Atlaso Release Repository</title>
            <style>
              :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
              body { margin: 0; background: #f3f8fb; color: #071a3a; }
              main { width: min(720px, calc(100% - 40px)); margin: 12vh auto; }
              article { padding: 40px; background: #fff; border: 1px solid #cbdce8; border-radius: 18px; box-shadow: 0 18px 50px rgb(7 26 58 / 10%); }
              .logo { width: min(320px, 80%); height: auto; margin-bottom: 28px; }
              p { line-height: 1.65; color: #38506c; }
              h1 { margin: 8px 0 12px; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.05; letter-spacing: -.04em; }
              .eyebrow { color: #1769e0; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
              .capabilities { color: #008f95; font-weight: 700; }
              .source { display: block; overflow-wrap: anywhere; margin: 24px 0; padding: 14px 16px; background: #edf8fa; border-radius: 10px; color: #071a3a; }
              nav { display: flex; flex-wrap: wrap; gap: 12px; }
              a { color: #1769e0; font-weight: 650; text-decoration: none; }
              a:hover, a:focus-visible { text-decoration: underline; }
              footer { margin-top: 28px; font-size: .875rem; }
            </style>
          </head>
          <body>
            <main>
              <article>
                <img class="logo" src="./atlaso-logo.svg" alt="Atlaso">
                <div class="eyebrow">Atlaso appliance updates</div>
                <h1>Everything your virtualization lab needs.</h1>
                <p class="capabilities">Infrastructure • Storage • Identity • Networking • Lifecycle</p>
                <p>Atlaso supports POC, lab, and test environments by simplifying deployment, maintenance, and validation. This site publishes machine-readable channel pointers for transactional Atlaso appliance updates.</p>
                <code class="source">https://mdaneri.github.io/Atlaso/updates</code>
                <nav aria-label="Release repository links">
                  <a href="./docs/">Documentation</a>
                  <a href="./updates/channels/development/manifest.json">Development channel</a>
                  <a href="https://github.com/mdaneri/Atlaso/releases">GitHub Releases</a>
                  <a href="https://github.com/mdaneri/Atlaso">Source repository</a>
                </nav>
                <footer><p>The HTML page is informational. Signed JSON documents under <code>/updates</code> remain the appliance protocol.</p></footer>
              </article>
            </main>
          </body>
          </html>
          EOF
          touch "$SITE_ROOT/.nojekyll"
          test -s "$SITE_ROOT/updates/channels/stable/manifest.json"
          test -s "$SITE_ROOT/updates/channels/stable/manifest.json.sig"
          git -C "$SITE_ROOT" add --all
          if git -C "$SITE_ROOT" diff --cached --quiet; then
            exit 0
          fi
          git -C "$SITE_ROOT" config user.name github-actions[bot]
          git -C "$SITE_ROOT" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$SITE_ROOT" commit -m "Advance development to v${VERSION}"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
            git -C "$SITE_ROOT" push origin HEAD:gh-pages
      - name: Verify the published development channel
        if: steps.development.outputs.decision != 'skip'
        run: |
          python scripts/check_published_release_channel.py \
            --channel-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/updates/channels/development/manifest.json" \
            --expected-channel development \
            --expected-version "$VERSION" \
            --expected-commit "$RELEASE_SHA" \
            --trusted-key "image/common/update-trust/${RELEASE_KEY_ID}.pem"
      - name: Remove protected signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/release-signing-key.pem"
