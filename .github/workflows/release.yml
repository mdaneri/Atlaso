name: Publish appliance release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_sha:
        description: Successful main CI commit to publish or recover
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: appliance-release-${{ inputs.release_sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release target
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.target.outputs.release_sha }}
    steps:
      - name: Check out the release target
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Validate successful main CI release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha || github.event.workflow_run.head_sha }}
        run: |
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Release SHA must be a full lowercase hexadecimal commit."
            exit 1
          fi
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if test "${{ github.event_name }}" = "workflow_dispatch"; then
            SUCCESSFUL_RUNS="$(
              gh api --method GET \
                "repos/${{ github.repository }}/actions/workflows/ci.yml/runs" \
                -f head_sha="$RELEASE_SHA" \
                -f branch=main \
                -f event=push \
                -f status=success \
                -f per_page=100 \
                --jq '.total_count'
            )"
            if test "$SUCCESSFUL_RUNS" -lt 1; then
              echo "::error::$RELEASE_SHA has no successful main push CI run."
              exit 1
            fi
          fi
          VERSION="$(python scripts/version.py get)"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  wheelhouse:
    name: Build ${{ matrix.abi }} wheelhouse
    needs:
      - prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - python: '3.14'
            abi: cp314
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install exact locked wheel build tools
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install --require-hashes --upgrade --requirement requirements-release-tools.lock
          python -m pip install --require-hashes --upgrade --requirement requirements-appliance-bootstrap.lock
      - name: Build the exact locked wheelhouse
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_SHA")"
          python -m pip wheel \
            --require-hashes \
            --no-build-isolation \
            --wheel-dir wheelhouse/${{ matrix.abi }} \
            --requirement requirements-appliance.lock
          python scripts/write_wheelhouse_lock.py --wheelhouse wheelhouse/${{ matrix.abi }}
      - name: Upload wheelhouse
        uses: actions/upload-artifact@v7
        with:
          name: wheelhouse-${{ matrix.abi }}
          path: wheelhouse/${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 7

  vmware_ova_build:
    name: Build canonical VMware OVA
    needs:
      - prepare
    runs-on: [self-hosted, Windows, X64, atlaso-vmware]
    environment: appliance-release
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate the exact protected commit
        shell: pwsh
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          git fetch origin main --no-tags
          if ((git rev-parse HEAD) -ne $env:RELEASE_SHA) { throw 'Checkout is not the requested release commit.' }
          git merge-base --is-ancestor $env:RELEASE_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is no longer reachable from origin/main.' }
      - name: Build the canonical VMware template
        shell: pwsh
        env:
          PACKER_SSH_PASSWORD: ${{ secrets.ATLASO_PACKER_SSH_PASSWORD }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.ATLASO_BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          if (-not $env:PACKER_SSH_PASSWORD -or -not $env:BOOTSTRAP_ADMIN_PASSWORD) {
            throw 'Protected release build credentials are unavailable.'
          }
          $ssh = ConvertTo-SecureString $env:PACKER_SSH_PASSWORD -AsPlainText -Force
          $admin = ConvertTo-SecureString $env:BOOTSTRAP_ADMIN_PASSWORD -AsPlainText -Force
          & scripts/windows/vmware/build-photon-image.ps1 `
            -SshPassword $ssh `
            -BootstrapAdminPassword $admin `
            -Headless `
            -EnableRealSystemAdapters
      - name: Export and independently validate the canonical OVA
        shell: pwsh
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          $version = python scripts/version.py get
          $name = "atlaso-v$version"
          & scripts/windows/vmware/export-ovf.ps1 -Name $name -Force
          $package = Get-Item -LiteralPath "image/vmware-workstation/ovf/$name" -ErrorAction Stop
          $ova = Get-Item -LiteralPath "image/vmware-workstation/ovf/$name.ova" -ErrorAction Stop
          $staging = 'artifacts/virtualization/ova'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Get-ChildItem -LiteralPath $package.FullName -File | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $staging
          }
          Copy-Item -LiteralPath $ova.FullName -Destination $staging
          $extract = Join-Path $env:RUNNER_TEMP ('ova-validation-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $extract | Out-Null
          try {
            $contract = python scripts/virtualization/validate_ova.py `
              (Join-Path $staging $ova.Name) --extract-directory $extract | ConvertFrom-Json
            if ($contract.source_commit -ne $env:RELEASE_SHA) {
              throw 'The exported OVA provenance does not identify the exact release commit.'
            }
          }
          finally {
            Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload canonical OVA package
        uses: actions/upload-artifact@v7
        with:
          name: virtualization-ova
          path: artifacts/virtualization/ova
          if-no-files-found: error
          retention-days: 7

  vmware_ova_smoke:
    name: Smoke canonical OVA on VMware
    needs:
      - prepare
      - vmware_ova_build
    runs-on: [self-hosted, Windows, X64, atlaso-vmware]
    environment: appliance-release
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate the exact protected commit
        shell: pwsh
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          git fetch origin main --no-tags
          if ((git rev-parse HEAD) -ne $env:RELEASE_SHA) { throw 'Checkout is not the requested release commit.' }
          git merge-base --is-ancestor $env:RELEASE_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is no longer reachable from origin/main.' }
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install locked SSH smoke dependency
        shell: pwsh
        run: python -m pip install --require-hashes --requirement requirements-deployment.lock
      - name: Download canonical OVA package
        uses: actions/download-artifact@v8
        with:
          name: virtualization-ova
          path: artifacts/incoming/ova
      - name: Import, boot, reboot, and validate VMware
        shell: pwsh
        env:
          SMOKE_USERNAME: ${{ vars.ATLASO_VIRTUALIZATION_SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.ATLASO_BOOTSTRAP_ADMIN_PASSWORD }}
          MANAGEMENT_VMNET: ${{ vars.ATLASO_VMWARE_MANAGEMENT_VMNET }}
          SERVICE_VMNET: ${{ vars.ATLASO_VMWARE_SERVICE_VMNET }}
        run: |
          $password = ConvertTo-SecureString $env:SMOKE_PASSWORD -AsPlainText -Force
          $credential = [PSCredential]::new($env:SMOKE_USERNAME, $password)
          $ova = @(Get-ChildItem artifacts/incoming/ova -Filter '*.ova' -File)
          if ($ova.Count -ne 1) { throw 'Expected exactly one canonical OVA artifact.' }
          & scripts/windows/virtualization/smoke-ova-vmware.ps1 `
            -OvaPath $ova[0].FullName `
            -Credential $credential `
            -ManagementVmnet $env:MANAGEMENT_VMNET `
            -ServiceVmnet $env:SERVICE_VMNET

  proxmox_ova_smoke:
    name: Smoke canonical OVA on Proxmox VE
    needs:
      - prepare
      - vmware_ova_build
    runs-on: [self-hosted, Linux, X64, atlaso-proxmox]
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate the exact protected commit
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Download canonical OVA package
        uses: actions/download-artifact@v8
        with:
          name: virtualization-ova
          path: artifacts/incoming/ova
      - name: Import, boot, reboot, and validate Proxmox VE
        env:
          VM_ID: ${{ vars.ATLASO_PROXMOX_SMOKE_VMID }}
          STORAGE: ${{ vars.ATLASO_PROXMOX_STORAGE }}
          MANAGEMENT_BRIDGE: ${{ vars.ATLASO_PROXMOX_MANAGEMENT_BRIDGE }}
          SERVICE_BRIDGE: ${{ vars.ATLASO_PROXMOX_SERVICE_BRIDGE }}
        run: |
          OVA="$(find artifacts/incoming/ova -maxdepth 1 -type f -name '*.ova' -print)"
          test -n "$OVA"
          scripts/virtualization/smoke-ova-linux.sh \
            proxmox "$OVA" "$VM_ID" "$STORAGE" "$MANAGEMENT_BRIDGE" "$SERVICE_BRIDGE"

  kvm_ova_smoke:
    name: Smoke canonical OVA on KVM
    needs:
      - prepare
      - vmware_ova_build
    runs-on: [self-hosted, Linux, X64, atlaso-kvm]
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate the exact protected commit
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Download canonical OVA package
        uses: actions/download-artifact@v8
        with:
          name: virtualization-ova
          path: artifacts/incoming/ova
      - name: Import, boot, reboot, and validate KVM
        env:
          DOMAIN: ${{ vars.ATLASO_KVM_SMOKE_DOMAIN }}
          POOL: ${{ vars.ATLASO_KVM_STORAGE_POOL }}
          MANAGEMENT_NETWORK: ${{ vars.ATLASO_KVM_MANAGEMENT_NETWORK }}
          SERVICE_NETWORK: ${{ vars.ATLASO_KVM_SERVICE_NETWORK }}
        run: |
          OVA="$(find artifacts/incoming/ova -maxdepth 1 -type f -name '*.ova' -print)"
          test -n "$OVA"
          scripts/virtualization/smoke-ova-linux.sh \
            kvm "$OVA" "$DOMAIN" "$POOL" "$MANAGEMENT_NETWORK" "$SERVICE_NETWORK"

  hyperv_package:
    name: Convert canonical OVA to Hyper-V ZIP
    needs:
      - prepare
      - vmware_ova_build
    runs-on: [self-hosted, Windows, X64, atlaso-hyperv]
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate the exact protected commit
        shell: pwsh
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          git fetch origin main --no-tags
          if ((git rev-parse HEAD) -ne $env:RELEASE_SHA) { throw 'Checkout is not the requested release commit.' }
          git merge-base --is-ancestor $env:RELEASE_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is no longer reachable from origin/main.' }
      - name: Download canonical OVA package
        uses: actions/download-artifact@v8
        with:
          name: virtualization-ova
          path: artifacts/incoming/ova
      - name: Convert the exact OVA payload
        shell: pwsh
        run: |
          $ova = @(Get-ChildItem artifacts/incoming/ova -Filter '*.ova' -File)
          if ($ova.Count -ne 1) { throw 'Expected exactly one canonical OVA artifact.' }
          & scripts/windows/virtualization/export-artifacts.ps1 -OvaPath $ova[0].FullName
      - name: Upload Hyper-V ZIP
        uses: actions/upload-artifact@v7
        with:
          name: virtualization-hyperv
          path: artifacts/virtualization/*-hyperv-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  hyperv_smoke:
    name: Smoke converted ZIP on Hyper-V
    needs:
      - prepare
      - hyperv_package
    runs-on: [self-hosted, Windows, X64, atlaso-hyperv]
    environment: appliance-release
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate the exact protected commit
        shell: pwsh
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          git fetch origin main --no-tags
          if ((git rev-parse HEAD) -ne $env:RELEASE_SHA) { throw 'Checkout is not the requested release commit.' }
          git merge-base --is-ancestor $env:RELEASE_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is no longer reachable from origin/main.' }
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install locked SSH smoke dependency
        shell: pwsh
        run: python -m pip install --require-hashes --requirement requirements-deployment.lock
      - name: Download Hyper-V ZIP
        uses: actions/download-artifact@v8
        with:
          name: virtualization-hyperv
          path: artifacts/incoming/hyperv
      - name: Import, boot, reboot, and validate Hyper-V
        shell: pwsh
        env:
          SMOKE_USERNAME: ${{ vars.ATLASO_VIRTUALIZATION_SMOKE_USERNAME }}
          SMOKE_PASSWORD: ${{ secrets.ATLASO_BOOTSTRAP_ADMIN_PASSWORD }}
          MANAGEMENT_SWITCH: ${{ vars.ATLASO_HYPERV_MANAGEMENT_SWITCH }}
          SERVICE_SWITCH: ${{ vars.ATLASO_HYPERV_SERVICE_SWITCH }}
        run: |
          $password = ConvertTo-SecureString $env:SMOKE_PASSWORD -AsPlainText -Force
          $credential = [PSCredential]::new($env:SMOKE_USERNAME, $password)
          $zip = @(Get-ChildItem artifacts/incoming/hyperv -Filter '*-hyperv-x86_64.zip' -File)
          if ($zip.Count -ne 1) { throw 'Expected exactly one Hyper-V ZIP artifact.' }
          & scripts/windows/virtualization/smoke-hyperv.ps1 `
            -ZipPath $zip[0].FullName `
            -Credential $credential `
            -ManagementSwitch $env:MANAGEMENT_SWITCH `
            -ServiceSwitch $env:SERVICE_SWITCH

  virtualization_release:
    name: Sign validated virtualization artifacts
    needs:
      - prepare
      - vmware_ova_build
      - vmware_ova_smoke
      - proxmox_ova_smoke
      - kvm_ova_smoke
      - hyperv_package
      - hyperv_smoke
    runs-on: ubuntu-latest
    environment: appliance-release
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download canonical OVA package
        uses: actions/download-artifact@v8
        with:
          name: virtualization-ova
          path: artifacts/incoming/ova
      - name: Download Hyper-V ZIP
        uses: actions/download-artifact@v8
        with:
          name: virtualization-hyperv
          path: artifacts/incoming/hyperv
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install locked release tooling
        env:
          PIP_CONFIG_FILE: /dev/null
        run: python -m pip install --require-hashes --requirement requirements-release-tools.lock
      - name: Stage and sign the exact virtualization set
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_KEY_ID: atlaso-release-2026-01
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          VERSION="$(python scripts/version.py get)"
          HYPERV_ZIP="$(find artifacts/incoming/hyperv -maxdepth 1 -type f -name '*-hyperv-x86_64.zip' -print)"
          test -n "$HYPERV_ZIP"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/release-signing-key.pem"
          python scripts/stage_virtualization_release.py \
            --ova-directory artifacts/incoming/ova \
            --hyperv-zip "$HYPERV_ZIP" \
            --output dist/virtualization-release \
            --version "$VERSION" \
            --commit "$RELEASE_SHA"
          BUILT_AT="$(git show -s --format=%cI "$RELEASE_SHA")"
          python scripts/build_virtualization_artifact_index.py \
            --assets dist/virtualization-release \
            --version "$VERSION" \
            --commit "$RELEASE_SHA" \
            --built-at "$BUILT_AT" \
            --signing-key "$RUNNER_TEMP/release-signing-key.pem" \
            --signing-key-id "$RELEASE_KEY_ID"
      - name: Upload signed virtualization release set
        uses: actions/upload-artifact@v7
        with:
          name: virtualization-release
          path: dist/virtualization-release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and publish release
    needs:
      - prepare
      - wheelhouse
      - virtualization_release
    runs-on: ubuntu-latest
    concurrency:
      group: atlaso-github-pages
      queue: max
      cancel-in-progress: false
    environment: appliance-release
    permissions:
      contents: write
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
      - name: Confirm the commit is still on main
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install locked release tooling
        env:
          PIP_CONFIG_FILE: /dev/null
        run: python -m pip install --require-hashes --requirement requirements-release-tools.lock
      - name: Download CPython 3.14 wheelhouse
        uses: actions/download-artifact@v8
        with:
          name: wheelhouse-cp314
          path: wheelhouses/cp314
      - name: Materialize the protected signing key
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/release-signing-key.pem"
      - name: Build and sign the immutable release
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_KEY_ID: atlaso-release-2026-01
        run: |
          BUILT_AT="$(git show -s --format=%cI "$RELEASE_SHA")"
          python scripts/build_release_bundle.py \
            --wheelhouses wheelhouses \
            --signing-key "$RUNNER_TEMP/release-signing-key.pem" \
            --signing-key-id "$RELEASE_KEY_ID" \
            --commit "$RELEASE_SHA" \
            --built-at "$BUILT_AT"
      - name: Download the signed virtualization release set
        uses: actions/download-artifact@v8
        with:
          name: virtualization-release
          path: dist/release
      - name: Publish the idempotent tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python scripts/publish_release.py \
            --commit "$RELEASE_SHA" \
            --assets dist/release \
            --require-virtualization-assets
      - name: Advance the signed development channel
        env:
          RELEASE_KEY_ID: atlaso-release-2026-01
        run: |
          VERSION="$(python scripts/version.py get)"
          SITE_ROOT="$RUNNER_TEMP/site"
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "$SITE_ROOT" 2>/dev/null || git init "$SITE_ROOT"
          if test "$VERSION" = "0.9.18"; then
            git -C "$SITE_ROOT" rm -r --ignore-unmatch .
          fi
          python scripts/promote_release_channel.py \
            --channel development \
            --expected-version "$VERSION" \
            --release-manifest-url "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/release-manifest.json" \
            --release-manifest dist/release/release-manifest.json \
            --release-signature dist/release/release-manifest.json.sig \
            --trusted-key image/common/update-trust/${RELEASE_KEY_ID}.pem \
            --site-root "$SITE_ROOT/updates" \
            --signing-key "$RUNNER_TEMP/release-signing-key.pem" \
            --signing-key-id "$RELEASE_KEY_ID"
          install -m 0644 docs/assets/brand/atlaso-logo-horizontal-light.svg "$SITE_ROOT/atlaso-logo.svg"
          cat > "$SITE_ROOT/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Atlaso Release Repository</title>
            <style>
              :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
              body { margin: 0; background: #f3f8fb; color: #071a3a; }
              main { width: min(720px, calc(100% - 40px)); margin: 12vh auto; }
              article { padding: 40px; background: #fff; border: 1px solid #cbdce8; border-radius: 18px; box-shadow: 0 18px 50px rgb(7 26 58 / 10%); }
              .logo { width: min(320px, 80%); height: auto; margin-bottom: 28px; }
              p { line-height: 1.65; color: #38506c; }
              h1 { margin: 8px 0 12px; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.05; letter-spacing: -.04em; }
              .eyebrow { color: #1769e0; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
              .capabilities { color: #008f95; font-weight: 700; }
              .source { display: block; overflow-wrap: anywhere; margin: 24px 0; padding: 14px 16px; background: #edf8fa; border-radius: 10px; color: #071a3a; }
              nav { display: flex; flex-wrap: wrap; gap: 12px; }
              a { color: #1769e0; font-weight: 650; text-decoration: none; }
              a:hover, a:focus-visible { text-decoration: underline; }
              footer { margin-top: 28px; font-size: .875rem; }
            </style>
          </head>
          <body>
            <main>
              <article>
                <img class="logo" src="./atlaso-logo.svg" alt="Atlaso">
                <div class="eyebrow">Atlaso appliance updates</div>
                <h1>Everything your virtualization lab needs.</h1>
                <p class="capabilities">Infrastructure • Storage • Identity • Networking • Lifecycle</p>
                <p>Atlaso supports POC, lab, and test environments by simplifying deployment, maintenance, and validation. This site publishes machine-readable channel pointers for transactional Atlaso appliance updates.</p>
                <code class="source">https://mdaneri.github.io/Atlaso/updates</code>
                <nav aria-label="Release repository links">
                  <a href="./docs/">Documentation</a>
                  <a href="./updates/channels/development/manifest.json">Development channel</a>
                  <a href="https://github.com/mdaneri/Atlaso/releases">GitHub Releases</a>
                  <a href="https://github.com/mdaneri/Atlaso">Source repository</a>
                </nav>
                <footer><p>The HTML page is informational. Signed JSON documents under <code>/updates</code> remain the appliance protocol.</p></footer>
              </article>
            </main>
          </body>
          </html>
          EOF
          touch "$SITE_ROOT/.nojekyll"
          test -s "$SITE_ROOT/updates/channels/stable/manifest.json"
          test -s "$SITE_ROOT/updates/channels/stable/manifest.json.sig"
          git -C "$SITE_ROOT" add --all
          if git -C "$SITE_ROOT" diff --cached --quiet; then
            exit 0
          fi
          git -C "$SITE_ROOT" config user.name github-actions[bot]
          git -C "$SITE_ROOT" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$SITE_ROOT" commit -m "Advance development to v${VERSION}"
          if git -C "$SITE_ROOT" remote get-url origin >/dev/null 2>&1; then
            git -C "$SITE_ROOT" push origin HEAD:gh-pages
          else
            git -C "$SITE_ROOT" remote add origin \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            git -C "$SITE_ROOT" push origin HEAD:gh-pages
          fi
      - name: Verify the published development channel
        env:
          RELEASE_KEY_ID: atlaso-release-2026-01
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          VERSION="$(python scripts/version.py get)"
          python scripts/check_published_release_channel.py \
            --channel-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/updates/channels/development/manifest.json" \
            --expected-channel development \
            --expected-version "$VERSION" \
            --expected-commit "$RELEASE_SHA" \
            --trusted-key "image/common/update-trust/${RELEASE_KEY_ID}.pem"
