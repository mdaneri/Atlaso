name: Version bump

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  repository_dispatch:
    types:
      - refresh-pull-request-version

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: version-bump-${{ github.event.pull_request.number || github.event.client_payload.pull_number }}
  cancel-in-progress: true

jobs:
  bump:
    name: Bump patch version
    if: github.event_name == 'repository_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate pull request
        id: pull-request
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.client_payload.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.pull_number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::A valid pull request number is required."
            exit 1
          fi
          pull_request="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pull_request")"
          base_ref="$(jq -r '.base.ref' <<<"$pull_request")"
          head_repository="$(jq -r '.head.repo.full_name // ""' <<<"$pull_request")"
          head_ref="$(jq -r '.head.ref' <<<"$pull_request")"
          head_sha="$(jq -r '.head.sha' <<<"$pull_request")"
          if [[ "$state" != "open" || "$base_ref" != "main" || "$head_repository" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Version automation accepts only open, same-repository pull requests targeting main."
            exit 1
          fi
          if [[ -n "$EXPECTED_HEAD_SHA" && "$head_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "::error::The pull request head changed before trusted version automation started."
            exit 1
          fi
          {
            echo "pull_number=$PR_NUMBER"
            echo "base_sha=$(jq -r '.base.sha' <<<"$pull_request")"
            echo "head_ref=$head_ref"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Check out trusted base automation
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pull-request.outputs.base_sha }}
          path: trusted
          persist-credentials: false
      - name: Check out pull request branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.pull-request.outputs.head_sha }}
          path: target
          fetch-depth: 0
      - name: Calculate and apply expected patch version
        run: python trusted/scripts/version.py bump --root target --base-root trusted
      - name: Detect version changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git -C target status --porcelain -- pyproject.toml atlaso/__init__.py clients/powershell/Atlaso/Atlaso.psd1)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit patch version
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ steps.pull-request.outputs.head_ref }}
        run: |
          version="$(sed -n 's/^version = "\([0-9][0-9.]*\)"$/\1/p' target/pyproject.toml | head -n 1)"
          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target add pyproject.toml atlaso/__init__.py clients/powershell/Atlaso/Atlaso.psd1
          git -C target commit -m "chore: bump version to ${version}"
          git -C target push origin "HEAD:${HEAD_REF}"
      - name: Confirm exact candidate head
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull_number }}
        run: |
          set -euo pipefail
          candidate_head_sha="$(git -C target rev-parse HEAD)"
          pull_request_head_sha=""
          for attempt in {1..12}; do
            pull_request_head_sha="$(
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha'
            )"
            if [[ "$candidate_head_sha" == "$pull_request_head_sha" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$candidate_head_sha" != "$pull_request_head_sha" ]]; then
            echo "::error::The pull request head changed before trusted CI dispatch."
            exit 1
          fi
          echo "head_sha=$candidate_head_sha" >> "$GITHUB_OUTPUT"
      - name: Run required checks for version commit
        if: steps.changes.outputs.changed == 'true' || github.event_name == 'repository_dispatch'
        env:
          BASE_SHA: ${{ steps.pull-request.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull_number }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref=main \
            -f "inputs[base_sha]=${BASE_SHA}" \
            -f "inputs[head_sha]=${HEAD_SHA}" \
            -f "inputs[pull_number]=${PR_NUMBER}"
