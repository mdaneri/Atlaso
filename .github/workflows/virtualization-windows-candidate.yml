name: Produce virtualization candidate on ephemeral Windows

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact successful main software-release commit
        required: true
        type: string
      prerelease_identifier:
        description: Explicit rc.N identifier
        required: true
        type: string
      windows_runner_label:
        description: Unique label of the approved ephemeral Windows runner
        required: true
        type: string
      management_vmnet:
        description: VMware management vmnet
        required: true
        default: VMnet8
        type: string
      service_vmnet:
        description: VMware service vmnet
        required: true
        default: VMnet1
        type: string
      management_switch:
        description: Hyper-V management switch
        required: true
        type: string
      service_switch:
        description: Hyper-V service switch
        required: true
        type: string

concurrency:
  group: virtualization-windows-${{ inputs.release_sha }}-${{ inputs.prerelease_identifier }}
  cancel-in-progress: false

jobs:
  admit:
    name: Admit exact software Release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      prerelease_tag: ${{ steps.target.outputs.prerelease_tag }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact main CI and software Release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RC: ${{ inputs.prerelease_identifier }}
        run: |
          set -euo pipefail
          test "${#RELEASE_SHA}" -eq 40
          case "$RELEASE_SHA" in *[!0-9a-f]*) exit 1;; esac
          python - "$RC" <<'PY'
          import re, sys
          if re.fullmatch(r"rc\.[1-9][0-9]*", sys.argv[1]) is None:
              raise SystemExit("prerelease_identifier must be rc.N")
          PY
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          COUNT="$(gh api --method GET "repos/${{ github.repository }}/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_SHA" -f branch=main -f event=push -f status=success \
            -f per_page=100 --jq .total_count)"
          test "$COUNT" -ge 1
          VERSION="$(python scripts/version.py get)"
          test "$(gh api "repos/${{ github.repository }}/commits/v$VERSION" --jq .sha)" = "$RELEASE_SHA"
          gh release view "v$VERSION" --json isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == false)' >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease_tag=virtualization-v${VERSION}-${RC}" >> "$GITHUB_OUTPUT"

  produce:
    name: Build and smoke OVA and Hyper-V candidate
    needs: admit
    runs-on: [self-hosted, Windows, X64, "${{ inputs.windows_runner_label }}"]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install locked release tooling
        shell: pwsh
        run: python -m pip install --require-hashes --requirement requirements-release-tools.lock
      - name: Produce exact candidate without publication authority
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_IDENTIFIER: ${{ inputs.prerelease_identifier }}
          MANAGEMENT_VMNET: ${{ inputs.management_vmnet }}
          SERVICE_VMNET: ${{ inputs.service_vmnet }}
          MANAGEMENT_SWITCH: ${{ inputs.management_switch }}
          SERVICE_SWITCH: ${{ inputs.service_switch }}
        run: |
          ./scripts/windows/vmware/export-ovf.ps1 -Prerelease -CandidateOnly `
            -PrereleaseIdentifier $env:PRERELEASE_IDENTIFIER `
            -StagingRoot (Join-Path $env:RUNNER_TEMP 'atlaso-virtualization') `
            -ManagementVmnet $env:MANAGEMENT_VMNET `
            -ServiceVmnet $env:SERVICE_VMNET `
            -ManagementSwitch $env:MANAGEMENT_SWITCH `
            -ServiceSwitch $env:SERVICE_SWITCH
      - uses: actions/upload-artifact@v7
        with:
          name: windows-virtualization-${{ inputs.release_sha }}-${{ inputs.prerelease_identifier }}
          path: ${{ runner.temp }}/atlaso-virtualization/${{ needs.admit.outputs.prerelease_tag }}/candidate
          if-no-files-found: error
          retention-days: 7

  stage_draft:
    name: Create immutable draft from hosted runner
    needs: [admit, produce]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: windows-virtualization-${{ inputs.release_sha }}-${{ inputs.prerelease_identifier }}
          path: candidate
      - name: Create or resume exact annotated tag and draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ needs.admit.outputs.prerelease_tag }}
          VERSION: ${{ needs.admit.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            REMOTE_TAGS="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
            test "$(printf '%s\n' "$REMOTE_TAGS" | wc -l)" -eq 2
            test "$(printf '%s\n' "$REMOTE_TAGS" | awk '/\^\{\}$/ {print $1}')" = "$RELEASE_SHA"
          else
            git tag -a "$RELEASE_TAG" -m "Atlaso virtualization prerelease $RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if ! gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --prerelease --verify-tag \
              --title "Atlaso Virtualization v$VERSION ${{ inputs.prerelease_identifier }}" \
              --notes 'Ephemeral-Windows candidate awaiting protected hosted finalization.'
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          mkdir "$RUNNER_TEMP/existing"
          for asset in candidate/*; do
            name="$(basename "$asset")"
            if gh release download "$RELEASE_TAG" --pattern "$name" --dir "$RUNNER_TEMP/existing" 2>/dev/null; then
              cmp --silent "$asset" "$RUNNER_TEMP/existing/$name"
            else
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done

  finalize:
    name: Protected hosted finalization
    needs: [admit, stage_draft]
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/virtualization-prerelease.yml
    with:
      release_sha: ${{ inputs.release_sha }}
      prerelease_tag: ${{ needs.admit.outputs.prerelease_tag }}
    secrets: inherit
