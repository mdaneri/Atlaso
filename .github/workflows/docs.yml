name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify documentation
    runs-on: ubuntu-latest
    outputs:
      site_changed: ${{ steps.site-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-docs.lock
      - run: python scripts/check_docs.py
      - run: python scripts/generate_embedded_screenshot_sections.py
      - run: git diff --exit-code
      - run: python scripts/build_docs.py
      - name: Check whether published documentation changed
        id: site-changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site_root="$(mktemp -d)"
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$site_root"
          python scripts/overlay_docs_site.py --built-docs site/docs --pages-root "$site_root"
          git -C "$site_root" add docs
          if git -C "$site_root" diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve changed documentation output
        if: steps.site-changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: documentation-site-${{ github.run_id }}
          path: site/docs
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish documentation
    needs: verify
    if: needs.verify.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: atlaso-github-pages
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: documentation-site-${{ github.run_id }}
          path: site/docs
      - name: Overlay documentation on the release repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SITE_ROOT="$(mktemp -d)"
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SITE_ROOT"
          python scripts/overlay_docs_site.py --built-docs site/docs --pages-root "$SITE_ROOT"
          test -s "$SITE_ROOT/updates/channels/stable/manifest.json"
          test -s "$SITE_ROOT/updates/channels/stable/manifest.json.sig"
          git -C "$SITE_ROOT" config user.name "github-actions[bot]"
          git -C "$SITE_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$SITE_ROOT" add docs
          if git -C "$SITE_ROOT" diff --cached --quiet; then
            echo "Documentation output is already current."
            exit 0
          fi
          git -C "$SITE_ROOT" commit -m "Publish Atlaso documentation ${GITHUB_SHA}"
          git -C "$SITE_ROOT" push origin HEAD:gh-pages
