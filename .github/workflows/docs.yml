name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlaso-github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-docs.lock
      - run: python scripts/check_docs.py
      - run: python scripts/generate_embedded_screenshot_sections.py
      - run: git diff --exit-code
      - run: zensical build --clean --strict
      - run: python scripts/generate_docs_redirects.py
      - name: Overlay documentation on the release repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site_root="$(mktemp -d)"
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$site_root"
          python scripts/overlay_docs_site.py --built-docs site/docs --pages-root "$site_root"
          git -C "$site_root" config user.name "github-actions[bot]"
          git -C "$site_root" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$site_root" add docs
          if git -C "$site_root" diff --cached --quiet; then
            echo "Documentation output is already current."
            exit 0
          fi
          git -C "$site_root" commit -m "Publish Atlaso documentation ${GITHUB_SHA}"
          git -C "$site_root" push origin HEAD:gh-pages
