name: Publish Python wheel

on:
  workflow_run:
    workflows:
      - CI
      - Replay Python wheel
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: python-wheel-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable wheel artifact
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      ((github.event.workflow_run.name == 'CI' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push') ||
       (github.event.workflow_run.name == 'Replay Python wheel' &&
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Admit the source CI evidence and wheel target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if test "$TRIGGER_WORKFLOW" = CI; then
            EXPECTED_WHEEL_SHA="$TRIGGER_HEAD_SHA"
            SOURCE_CI_RUN_ID="$TRIGGER_RUN_ID"
            SOURCE_CI_RUN_ATTEMPT="$TRIGGER_RUN_ATTEMPT"
          else
            REQUEST_NAME="atlaso-wheel-replay-request-${TRIGGER_RUN_ID}-${TRIGGER_RUN_ATTEMPT}"
            REQUEST_ARTIFACTS="$(gh api \
              "repos/${{ github.repository }}/actions/runs/${TRIGGER_RUN_ID}/artifacts")"
            REQUEST_ARTIFACT_ID="$(jq -r \
              --arg name "$REQUEST_NAME" \
              '[.artifacts[] | select(.expired == false and .name == $name)] | if length == 1 then .[0].id else empty end' \
              <<<"$REQUEST_ARTIFACTS")"
            test -n "$REQUEST_ARTIFACT_ID"
            gh api "repos/${{ github.repository }}/actions/artifacts/${REQUEST_ARTIFACT_ID}/zip" \
              > "$RUNNER_TEMP/wheel-replay-request.zip"
            test "$(unzip -Z1 "$RUNNER_TEMP/wheel-replay-request.zip")" = wheel-replay-request.json
            unzip -p "$RUNNER_TEMP/wheel-replay-request.zip" wheel-replay-request.json \
              > "$RUNNER_TEMP/wheel-replay-request.json"
            REQUEST="$(jq -cS . "$RUNNER_TEMP/wheel-replay-request.json")"
            test "$(jq -cS . <<<"$REQUEST")" = "$(cat "$RUNNER_TEMP/wheel-replay-request.json")"
            test "$(jq -c 'keys' <<<"$REQUEST")" = \
              '["commit","repository","source_ci_run_attempt","source_ci_run_id"]'
            test "$(jq -r .repository <<<"$REQUEST")" = "${{ github.repository }}"
            EXPECTED_WHEEL_SHA="$(jq -r .commit <<<"$REQUEST")"
            SOURCE_CI_RUN_ID="$(jq -r .source_ci_run_id <<<"$REQUEST")"
            SOURCE_CI_RUN_ATTEMPT="$(jq -r .source_ci_run_attempt <<<"$REQUEST")"
          fi
          if ! printf '%s' "$EXPECTED_WHEEL_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Wheel SHA must be a full lowercase hexadecimal commit."
            exit 1
          fi
          if ! printf '%s' "$SOURCE_CI_RUN_ID" | grep -Eq '^[1-9][0-9]*$' ||
             ! printf '%s' "$SOURCE_CI_RUN_ATTEMPT" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::Source CI run ID and attempt must be positive integers."
            exit 1
          fi
          SOURCE_CI_STATE="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${SOURCE_CI_RUN_ID}/attempts/${SOURCE_CI_RUN_ATTEMPT}")"
          test "$(jq -r .name <<<"$SOURCE_CI_STATE")" = CI
          test "$(jq -r .path <<<"$SOURCE_CI_STATE")" = .github/workflows/ci.yml
          test "$(jq -r .event <<<"$SOURCE_CI_STATE")" = push
          test "$(jq -r .head_repository.full_name <<<"$SOURCE_CI_STATE")" = "${{ github.repository }}"
          test "$(jq -r .head_branch <<<"$SOURCE_CI_STATE")" = main
          WHEEL_SHA="$(jq -r .head_sha <<<"$SOURCE_CI_STATE")"
          test "$WHEEL_SHA" = "$EXPECTED_WHEEL_SHA"
          test "$(jq -r .run_attempt <<<"$SOURCE_CI_STATE")" = "$SOURCE_CI_RUN_ATTEMPT"
          test "$(jq -r .conclusion <<<"$SOURCE_CI_STATE")" = success
          MAIN_COMPARISON="$(gh api \
            "repos/${{ github.repository }}/compare/${WHEEL_SHA}...main")"
          MAIN_STATUS="$(jq -r .status <<<"$MAIN_COMPARISON")"
          test "$MAIN_STATUS" = ahead || test "$MAIN_STATUS" = identical
          echo "commit=$WHEEL_SHA" >> "$GITHUB_OUTPUT"
          echo "source_ci_run_id=$SOURCE_CI_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_ci_run_attempt=$SOURCE_CI_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if test "$TRIGGER_WORKFLOW" = CI; then
            echo "publisher_trigger=automatic-main" >> "$GITHUB_OUTPUT"
          else
            echo "publisher_trigger=replay" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out protected publisher tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: tooling
      - name: Check out the admitted successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          path: target-source
      - name: Resolve the wheel identity
        id: identity
        env:
          WHEEL_SHA: ${{ steps.target.outputs.commit }}
        run: |
          test "$(git -C target-source rev-parse HEAD)" = "$WHEEL_SHA"
          VERSION="$(python tooling/scripts/version.py --root target-source get)"
          BUILT_AT="$(git -C target-source show -s --format=%cI "$WHEEL_SHA")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "built_at=$BUILT_AT" >> "$GITHUB_OUTPUT"
          echo "artifact_name=atlaso-wheel-v${VERSION}-${WHEEL_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install exact locked wheel build tools
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: python -m pip install --require-hashes --requirement target-source/requirements-release-tools.lock
      - name: Build and verify the commit-bound wheel
        env:
          WHEEL_SHA: ${{ steps.target.outputs.commit }}
          SOURCE_CI_RUN_ID: ${{ steps.target.outputs.source_ci_run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ steps.target.outputs.source_ci_run_attempt }}
        run: |
          python tooling/scripts/wheel_artifact.py create \
            --source-root target-source \
            --output dist/wheel-artifact \
            --repository "${{ github.repository }}" \
            --version "${{ steps.identity.outputs.version }}" \
            --commit "$WHEEL_SHA" \
            --built-at "${{ steps.identity.outputs.built_at }}" \
            --source-ci-run-id "$SOURCE_CI_RUN_ID" \
            --source-ci-run-attempt "$SOURCE_CI_RUN_ATTEMPT" \
            --publisher-run-id "${{ github.run_id }}" \
            --publisher-run-attempt "${{ github.run_attempt }}" \
            --publisher-trigger "${{ steps.target.outputs.publisher_trigger }}"
      - name: Publish the immutable wheel handoff
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: dist/wheel-artifact
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
