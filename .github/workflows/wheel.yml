name: Publish Python wheel

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: python-wheel-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable wheel artifact
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the successful main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the automatic wheel target
        id: target
        env:
          WHEEL_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! printf '%s' "$WHEEL_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Wheel SHA must be a full lowercase hexadecimal commit."
            exit 1
          fi
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$WHEEL_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$WHEEL_SHA"
          VERSION="$(python scripts/version.py get)"
          BUILT_AT="$(date --utc --date="@$(git show -s --format=%ct "$WHEEL_SHA")" '+%Y-%m-%dT%H:%M:%SZ')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "built_at=$BUILT_AT" >> "$GITHUB_OUTPUT"
          echo "artifact_name=atlaso-wheel-v${VERSION}-${WHEEL_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install exact locked wheel build tools
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: python -m pip install --require-hashes --requirement requirements-release-tools.lock
      - name: Build and verify the commit-bound wheel
        env:
          WHEEL_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python scripts/wheel_artifact.py create \
            --output dist/wheel-artifact \
            --repository "${{ github.repository }}" \
            --version "${{ steps.target.outputs.version }}" \
            --commit "$WHEEL_SHA" \
            --built-at "${{ steps.target.outputs.built_at }}" \
            --source-ci-run-id "${{ github.event.workflow_run.id }}" \
            --source-ci-run-attempt "${{ github.event.workflow_run.run_attempt }}" \
            --publisher-run-id "${{ github.run_id }}" \
            --publisher-run-attempt "${{ github.run_attempt }}"
      - name: Publish the immutable wheel handoff
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.target.outputs.artifact_name }}
          path: dist/wheel-artifact
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
