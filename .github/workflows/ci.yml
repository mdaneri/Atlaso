name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit used to validate the expected patch version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-policy:
    name: ${{ github.event_name == 'pull_request' && github.actor == 'github-actions[bot]' && 'Approval-gated Version policy' || 'Version policy' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check out pull request base
        if: github.event_name != 'push'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          path: .version-base
      - name: Validate pull request patch version
        if: github.event_name != 'push'
        run: python scripts/version.py check --root . --base-root .version-base
      - name: Validate main version consistency
        if: github.event_name == 'push'
        run: python scripts/version.py check --root .

  repository-checks:
    name: ${{ github.event_name == 'pull_request' && github.actor == 'github-actions[bot]' && 'Approval-gated Repository checks' || 'Repository checks' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install --require-hashes -r requirements-docs.lock
      - run: npm ci
      - run: npm run test:javascript
      - run: npm run lint:markdown
      - run: zensical build --clean --strict
      - run: python scripts/generate_docs_redirects.py
      - run: python scripts/check_docs.py
      - run: python scripts/generate_embedded_screenshot_sections.py
      - run: git diff --exit-code
      - name: Enforce the exact appliance dependency lock
        run: python scripts/check_appliance_lock.py
      - run: python scripts/check_repo.py

  python-tests:
    name: ${{ github.event_name == 'pull_request' && github.actor == 'github-actions[bot]' && 'Approval-gated Python tests' || 'Python tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
