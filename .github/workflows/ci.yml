name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit used to validate the expected patch version
        required: true
        type: string
      head_sha:
        description: Exact pull-request head to validate
        required: true
        type: string
      pull_number:
        description: Pull request receiving trusted required contexts
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pull_number || github.ref }}
  cancel-in-progress: true

jobs:
  trusted-contexts-start:
    name: Register trusted required contexts
    if: github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Validate target and publish pending contexts
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pull_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ || ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Trusted CI requires a pull request number and exact base/head SHAs."
            exit 1
          fi
          pull_request="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pull_request")"
          base_ref="$(jq -r '.base.ref' <<<"$pull_request")"
          base_sha="$(jq -r '.base.sha' <<<"$pull_request")"
          head_repository="$(jq -r '.head.repo.full_name // ""' <<<"$pull_request")"
          head_sha="$(jq -r '.head.sha' <<<"$pull_request")"
          if [[ "$state" != "open" || "$base_ref" != "main" || "$base_sha" != "$BASE_SHA" || "$head_repository" != "$GITHUB_REPOSITORY" || "$head_sha" != "$HEAD_SHA" ]]; then
            echo "::error::Trusted CI accepts only the current head and base of an open same-repository pull request targeting main."
            exit 1
          fi
          while IFS= read -r context; do
            jq -n \
              --arg context "$context" \
              --arg description "Trusted CI run $GITHUB_RUN_ID is validating this exact pull request head." \
              --arg target_url "$RUN_URL" \
              '{state: "pending", context: $context, description: $description, target_url: $target_url}' |
              gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
                --input -
          done <<'EOF'
          Version policy
          Repository checks
          Python tests
          EOF

  version-policy:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Trusted Version policy validation' || github.event_name == 'pull_request' && github.actor == 'github-actions[bot]' && 'Approval-gated Version policy' || 'Version policy' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out pull request base
        if: github.event_name != 'push'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.pull_request.base.sha }}
          path: .version-base
          persist-credentials: false
      - name: Validate pull request patch version
        if: github.event_name != 'push'
        run: python scripts/version.py check --root . --base-root .version-base
      - name: Validate main version consistency
        if: github.event_name == 'push'
        run: python scripts/version.py check --root .

  repository-checks:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Trusted Repository checks validation' || github.event_name == 'pull_request' && github.actor == 'github-actions[bot]' && 'Approval-gated Repository checks' || 'Repository checks' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Enforce Python dependency age policy
        run: python scripts/check_dependency_policy.py
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install --require-hashes -r requirements-docs.lock
      - run: npm ci
      - run: npm run test:javascript
      - run: npm run lint:markdown
      - run: zensical build --clean --strict
      - run: python scripts/generate_docs_redirects.py
      - run: python scripts/check_docs.py
      - run: python scripts/generate_embedded_screenshot_sections.py
      - run: git diff --exit-code
      - name: Enforce the exact appliance dependency lock
        run: python scripts/check_appliance_lock.py
      - run: python scripts/check_repo.py

  python-tests:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Trusted Python tests validation' || github.event_name == 'pull_request' && github.actor == 'github-actions[bot]' && 'Approval-gated Python tests' || 'Python tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest

  trusted-contexts-finish:
    name: Publish trusted required contexts
    if: always() && github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]'
    needs:
      - trusted-contexts-start
      - version-policy
      - repository-checks
      - python-tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Revalidate target and publish final contexts
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pull_number }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
          REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          START_RESULT: ${{ needs.trusted-contexts-start.result }}
          VERSION_RESULT: ${{ needs.version-policy.result }}
        run: |
          set -euo pipefail
          if [[ "$START_RESULT" != "success" ]]; then
            echo "::error::Trusted required contexts were not registered for this run."
            exit 1
          fi
          pull_request="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pull_request")"
          base_ref="$(jq -r '.base.ref' <<<"$pull_request")"
          base_sha="$(jq -r '.base.sha' <<<"$pull_request")"
          head_repository="$(jq -r '.head.repo.full_name // ""' <<<"$pull_request")"
          head_sha="$(jq -r '.head.sha' <<<"$pull_request")"
          if [[ "$state" != "open" || "$base_ref" != "main" || "$head_repository" != "$GITHUB_REPOSITORY" || "$head_sha" != "$HEAD_SHA" ]]; then
            echo "::error::The pull request changed before trusted CI completed; no final contexts were published."
            exit 1
          fi
          post_status() {
            local context="$1"
            local result="$2"
            local status_state="error"
            local description="Trusted CI run $GITHUB_RUN_ID did not complete this validation."
            if [[ "$base_sha" != "$BASE_SHA" ]]; then
              description="The pull request base advanced; update the branch and rerun trusted CI."
            elif [[ "$result" == "success" ]]; then
              status_state="success"
              description="Trusted CI run $GITHUB_RUN_ID passed this validation on the exact head."
            elif [[ "$result" == "failure" ]]; then
              status_state="failure"
              description="Trusted CI run $GITHUB_RUN_ID failed this validation on the exact head."
            fi
            jq -n \
              --arg context "$context" \
              --arg description "$description" \
              --arg state "$status_state" \
              --arg target_url "$RUN_URL" \
              '{state: $state, context: $context, description: $description, target_url: $target_url}' |
              gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
                --input -
          }
          post_status "Version policy" "$VERSION_RESULT"
          post_status "Repository checks" "$REPOSITORY_RESULT"
          post_status "Python tests" "$PYTHON_RESULT"
