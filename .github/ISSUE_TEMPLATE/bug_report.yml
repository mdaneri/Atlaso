name: Bug report
description: Report incorrect, unsafe, or regressed LabFoundry behavior.
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private keys, or security vulnerabilities. Use the Security Policy for sensitive reports."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproducible sequence and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LabFoundry version or commit
    validations:
      required: true
