[project]
site_name = "Atlaso Documentation"
site_description = "Operator-first documentation for the Atlaso virtualization lab appliance."
site_author = "Atlaso contributors"
site_url = "https://mdaneri.github.io/Atlaso/docs/"
docs_dir = "docs"
site_dir = "site/docs"
repo_url = "https://github.com/mdaneri/Atlaso"
repo_name = "mdaneri/Atlaso"
edit_uri = "edit/main/docs/"
copyright = "Copyright © 2026 Atlaso contributors"
extra_css = ["assets/stylesheets/atlaso.css"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Overview" = "getting-started/index.md" },
  ] },
  { "Operate" = [
    { "Overview" = "operate/index.md" },
    { "Dashboard" = "operate/dashboard.md" },
    { "Appliance Apply" = "operate/appliance-apply.md" },
    { "Local appliance console" = "operate/appliance-console.md" },
    { "Appliance Update" = "operate/appliance-update.md" },
    { "Automation" = "operate/automation.md" },
    { "Web Terminal" = "operate/web-terminal.md" },
  ] },
  { "Services" = [
    { "Overview" = "services/index.md" },
    { "DNS" = "services/dns.md" },
    { "ESX storage" = "services/esx-storage.md" },
    { "Network boot" = "services/ipxe.md" },
    { "Managed LDAP" = "services/managed-ldap.md" },
    { "OpenID Connect provider" = "services/oidc-provider.md" },
    { "VCF Helper" = "services/vcf-helper.md" },
    { "VCF certificate trust" = "services/vcf-trust.md" },
  ] },
  { "Reference" = [
    { "Overview" = "reference/index.md" },
    { "Verified interface gallery" = "reference/interface-gallery.md" },
    { "Full technical reference" = "reference/full-technical-reference.md" },
    { "Hyper-V lifecycle testing" = "reference/hyperv-lifecycle-testing.md" },
    { "VMware lifecycle testing" = "reference/vmware-workstation-lifecycle-testing.md" },
  ] },
  { "Contribute" = [
    { "Overview" = "contribute/index.md" },
    { "Documentation authoring" = "contribute/documentation-authoring.md" },
    { "UI design guide" = "contribute/ui-design-guide.md" },
    { "Detailed agent policies" = "contribute/agent-policies.md" },
  ] },
  { "Project" = [
    { "Overview" = "project/index.md" },
    { "Brand assets" = "project/branding.md" },
    { "Brand kit" = "assets/brand/BRAND_GUIDE.md" },
    { "CA roadmap" = "project/ca-roadmap.md" },
    { "Routing and WAN roadmap" = "project/routing-wan-roadmap.md" },
    { "Appliance console design QA" = "project/appliance-console-design-qa.md" },
    { "Monitor interaction design QA" = "project/monitor-apply-ux-design-qa.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/brand/atlaso-logo-horizontal-dark.svg"
favicon = "assets/brand/favicon.ico"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
