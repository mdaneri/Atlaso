<fieldset
  class="vcf-vault-credential-picker"
  data-vcf-vault-credential-picker
  data-address-field="{{ credential_address_field }}"
  data-username-field="{{ credential_username_field }}"
  data-password-field="{{ credential_password_field }}"
  data-port-field="{{ credential_port_field | default('') }}"
>
  <legend>Saved vault credential</legend>
  <p class="muted">Select an existing vault key to fill the server and username. Its password stays on the server and is used only for this request.</p>
  <div class="form-grid">
    <label>
      <span>Vault</span>
      <select name="credential_vault_id" data-vcf-credential-vault>
        <option value="">Enter credentials manually</option>
        {% for vault in vcf_vault_credential_options %}
          <option value="{{ vault.id }}">{{ vault.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      <span>Key</span>
      <select name="credential_entry_id" data-vcf-credential-entry disabled>
        <option value="">Choose a vault first</option>
      </select>
    </label>
  </div>
  <p class="muted" data-vcf-credential-status>
    {% if vcf_vault_credential_options %}Manual credentials are active.{% else %}No vault keys are available to this account.{% endif %}
  </p>
</fieldset>
