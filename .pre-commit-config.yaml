repos:
  - repo: local
    hooks:
      - id: atlaso-repo-check
        name: Atlaso repository checks
        entry: python scripts/check_repo.py
        language: system
        pass_filenames: true
        files: '(\.(conf|css|hcl|html?|js|json|md|ps1|py|service|svg|toml|ya?ml)$|^image/(hyperv|vmware-workstation)/sudoers\.d/[^/]+$)'
        exclude: '^(atlaso/app/static/vendor/|third_party/|VCFDT/|vcfDownloadTool/|dist/|build/|test-results/)'
      - id: atlaso-deployment-asset-check
        name: Atlaso deployment asset checks
        entry: python scripts/check_deployment_assets.py --mode auto
        language: system
        pass_filenames: true
        always_run: true
        files: '^image/(.*\.pkr\.[^/]+|(common|hyperv|vmware-workstation)/(systemd/|sudoers\.d/))'
      - id: atlaso-python-static-analysis
        name: Atlaso Python static analysis
        entry: python scripts/check_python_static_analysis.py
        language: system
        pass_filenames: false
        files: '(\.py$|^pyproject\.toml$|^scripts/check_python_static_analysis\.py$|^scripts/appliance/atlaso-(bootstrap-https|helper)$)'
