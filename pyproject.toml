[project]
name = "atlaso"
version = "0.9.37"
description = "Atlaso supports POC, lab, and test environments by simplifying deployment, maintenance, and validation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Authlib==1.7.2",
  "argon2-cffi>=23.1.0",
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.4",
  "joserfc>=1.3.5,<2",
  "httpx>=0.27.2",
  "paramiko>=3.5.0",
  "pyjwt>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pykmip==0.10.0",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
  "vcf-sdk==9.1.0.0",
]

[project.scripts]
atlaso-console = "atlaso.app.appliance_console:main"
atlaso-worker = "atlaso.app.worker:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "httpx2>=2.5.0",
  "pre-commit>=4.2.0",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlaso"]
artifacts = [
  "atlaso/app/static/**",
  "atlaso/app/templates/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
]
