[project]
name = "atlaso"
version = "0.9.174"
description = "Atlaso supports POC, lab, and test environments by simplifying deployment, maintenance, and validation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Authlib==1.7.2",
  "argon2-cffi>=23.1.0",
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.4",
  "joserfc>=1.3.5,<2",
  "httpx>=0.27.2",
  "paramiko>=3.5.0",
  "pycdlib==1.16.0",
  "pyjwt>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
  "vcf-sdk==9.1.0.0",
]

[project.scripts]
atlaso-console = "atlaso.app.appliance_console:main"
atlaso-kmip = "atlaso.app.kmip.server:main"
atlaso-vault = "atlaso.app.vault_cli:main"
atlaso-worker = "atlaso.app.worker:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "httpx2>=2.5.0",
  "markdown==3.10.2",
  "pre-commit>=4.2.0",
  "pymdown-extensions==11.0.1",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlaso"]
artifacts = [
  "atlaso/app/static/**",
  "atlaso/app/templates/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py314"
extend-exclude = [
  "VCFDT",
  "third_party",
  "vcfDownloadTool",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE", "I"]
ignore = [
  # FastAPI dependency injection intentionally calls Depends, Form, and similar
  # factories in function defaults.
  "B008",
]

[tool.mypy]
python_version = "3.14"
strict = true
show_error_codes = true
warn_unused_configs = true
follow_imports = "silent"
files = [
  "atlaso/app/factory_reset.py",
  "atlaso/app/routers/api_v1/firewall.py",
  "atlaso/app/routers/api_v1/physical_vlans.py",
  "atlaso/app/routers/api_v1/routes_wan.py",
  "atlaso/app/routers/contracts.py",
  "atlaso/app/routers/registry.py",
  "atlaso/app/routers/ui/firewall.py",
  "atlaso/app/routers/ui/physical_vlans.py",
  "atlaso/app/routers/ui/routes_wan.py",
  "atlaso/app/services/identity_credentials.py",
  "atlaso/app/services/interface_updates.py",
  "atlaso/app/services/physical_interfaces.py",
  "atlaso/app/services/service_registry.py",
]
